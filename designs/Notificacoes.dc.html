<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{ --brand:#F55F16; --brand-hover:#FF7A3D; --brand-soft:rgba(245,95,22,.10);
    --bg:#F8F9FA; --surface:#FFFFFF; --surface-2:#F1F5F9; --border:#E2E8F0; --text:#1A202C; --muted:#718096; --field:#F8F9FA; }
  :root[data-theme="dark"]{ --bg:#121212; --surface:#1E1E1E; --surface-2:#2A2A2A; --border:#333333; --text:#DBD9D8; --muted:#9C9C9C; --field:#161616; --brand-soft:rgba(245,95,22,.14); }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;}
  @keyframes ybToastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  ::-webkit-scrollbar{width:8px;height:8px;} ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;} ::-webkit-scrollbar-track{background:transparent;}
</style>
</helmet>

<div style="display:flex;height:100vh;width:100%;overflow:hidden;background:var(--bg);color:var(--text);">
  <div class="yb-side"><dc-import name="Sidebar" active="" hint-size="260px,100%"></dc-import></div>
  <dc-import name="MobileNav" active="mais" hint-size="0,0"></dc-import>

  <div style="flex:1;display:flex;flex-direction:column;min-width:0;">
    <header style="height:72px;flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 28px;gap:20px;">
      <div>
        <div style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-weight:600;"><a href="Dashboard.dc.html" style="color:var(--muted);text-decoration:none;" style-hover="color:var(--brand);">Dashboard</a><span>/</span><span style="color:var(--text);">Notificações</span></div>
        <h2 style="margin:2px 0 0;font-size:18px;font-weight:900;">Notificações</h2>
      </div>
      <div style="display:flex;align-items:center;gap:10px;">
        <button onClick="{{ toggleTheme }}" title="Alternar tema" style="width:40px;height:40px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;" style-hover="color:var(--brand);border-color:var(--brand);">
          <sc-if value="{{ isDark }}" hint-placeholder-val="{{ true }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path></svg></sc-if>
          <sc-if value="{{ isLight }}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg></sc-if>
        </button>
        <button onClick="{{ markAll }}" style="display:flex;align-items:center;gap:7px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:11px;padding:9px 14px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;" style-hover="border-color:var(--brand);color:var(--brand);">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 7 17l-5-5"></path><path d="m22 10-7.5 7.5L13 16"></path></svg> Marcar todas como lidas
        </button>
        <button title="Configurar notificações" style="width:40px;height:40px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;" style-hover="color:var(--brand);border-color:var(--brand);"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2Z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
      </div>
    </header>

    <main style="flex:1;overflow-y:auto;padding:28px;">
      <div style="max-width:840px;margin:0 auto;">

        <!-- Filters -->
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:22px;">
          <div style="display:flex;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:4px;flex-wrap:wrap;">
            <button onClick="{{ pickAll }}" style="{{ segAll }}">Todas <span style="opacity:.6;">{{ countAll }}</span></button>
            <button onClick="{{ pickUnread }}" style="{{ segUnread }}">Não lidas <span style="opacity:.6;">{{ countUnread }}</span></button>
            <button onClick="{{ pickUsers }}" style="{{ segUsers }}">Usuários</button>
            <button onClick="{{ pickBilling }}" style="{{ segBilling }}">Cobrança</button>
            <button onClick="{{ pickSystem }}" style="{{ segSystem }}">Sistema</button>
          </div>
        </div>

        <!-- Empty state -->
        <sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:80px 20px;">
          <span style="display:inline-flex;width:64px;height:64px;border-radius:18px;background:var(--surface-2);color:var(--muted);align-items:center;justify-content:center;margin-bottom:18px;"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg></span>
          <h3 style="margin:0 0 6px;font-size:17px;font-weight:900;">Tudo em dia!</h3>
          <p style="margin:0;font-size:14px;color:var(--muted);">Nenhuma notificação neste filtro.</p>
        </div>
        </sc-if>

        <!-- Groups -->
        <sc-if value="{{ hasItems }}" hint-placeholder-val="{{ true }}">
        <div style="display:flex;flex-direction:column;gap:24px;">
          <sc-for list="{{ groups }}" as="g" hint-placeholder-count="2">
          <div>
            <p style="margin:0 0 10px;font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;">{{ g.label }}</p>
            <div style="background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;">
              <sc-for list="{{ g.items }}" as="n" hint-placeholder-count="3">
              <div onClick="{{ n.toggle }}" style="display:flex;gap:14px;padding:16px 18px;border-bottom:1px solid var(--border);cursor:pointer;position:relative;background:{{ n.rowBg }};" style-hover="background:var(--surface-2);">
                <span style="width:40px;height:40px;border-radius:11px;background:{{ n.iconBg }};color:{{ n.iconColor }};display:flex;align-items:center;justify-content:center;flex-shrink:0;">{{ n.icon }}</span>
                <div style="flex:1;min-width:0;">
                  <p style="margin:0;font-size:14px;font-weight:{{ n.weight }};line-height:1.4;">{{ n.title }}</p>
                  <p style="margin:3px 0 0;font-size:13px;color:var(--muted);line-height:1.5;">{{ n.body }}</p>
                  <sc-if value="{{ n.hasAction }}" hint-placeholder-val="{{ false }}">
                  <div style="display:flex;gap:8px;margin-top:10px;">
                    <a href="{{ n.actionHref }}" style="display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;color:var(--brand);background:var(--brand-soft);border-radius:8px;padding:6px 12px;text-decoration:none;" style-hover="background:var(--brand);color:#fff;">{{ n.actionLabel }}</a>
                  </div>
                  </sc-if>
                </div>
                <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex-shrink:0;">
                  <span style="font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;">{{ n.time }}</span>
                  <sc-if value="{{ n.unread }}" hint-placeholder-val="{{ true }}"><span style="width:9px;height:9px;border-radius:50%;background:var(--brand);"></span></sc-if>
                </div>
              </div>
              </sc-for>
            </div>
          </div>
          </sc-for>
        </div>
        </sc-if>

      </div>
    </main>
  </div>

  <!-- Snackbar -->
  <sc-if value="{{ toastShown }}" hint-placeholder-val="{{ false }}">
  <div style="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:80;display:flex;align-items:center;gap:11px;background:var(--text);color:var(--bg);padding:13px 18px;border-radius:13px;box-shadow:0 12px 40px rgba(0,0,0,.28);animation:ybToastIn .25s ease-out both;">
    <span style="display:inline-flex;width:24px;height:24px;border-radius:50%;background:#16a34a;color:#fff;align-items:center;justify-content:center;flex-shrink:0;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></span>
    <span style="font-size:14px;font-weight:700;">{{ toastMsg }}</span>
    <button onClick="{{ hideToast }}" style="background:none;border:none;color:var(--bg);opacity:.6;cursor:pointer;display:flex;padding:2px;margin-left:6px;" style-hover="opacity:1;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
  </div>
  </sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:960}}">
class Component extends DCLogic {
  state = {
    theme: 'dark', filter: 'all', toast: false, toastMsg: '',
    read: {}, // id -> true when marked read
  };
  componentDidMount(){ this.applyTheme(); }
  componentWillUnmount(){ if (this._t) clearTimeout(this._t); }
  applyTheme(){ try{ document.documentElement.dataset.theme = this.state.theme; }catch(e){} }
  toggleTheme = () => this.setState(s => ({ theme: s.theme === 'dark' ? 'light' : 'dark' }), this.applyTheme);
  pick = (f) => () => this.setState({ filter: f });
  showToast = (msg) => {
    this.setState({ toast: true, toastMsg: msg });
    if (this._t) clearTimeout(this._t);
    this._t = setTimeout(() => this.setState({ toast: false }), 3000);
  };
  hideToast = () => { if (this._t) clearTimeout(this._t); this.setState({ toast: false }); };
  toggleRead = (id) => () => this.setState(s => ({ read: { ...s.read, [id]: !s.read[id] } }));
  markAll = () => { const all = {}; this.data().forEach(n => all[n.id] = true); this.setState({ read: all }); this.showToast('Todas marcadas como lidas'); };

  data(){
    // base notifications (unread flag is base; overridden by state.read)
    return [
      { id:1, cat:'users', icon:'👤', iconBg:'rgba(59,130,246,.12)', iconColor:'#3b82f6', title:'Novo usuário Pro: Mariana Silva', body:'Assinou o plano Pro Anual há instantes.', time:'há 5 min', baseUnread:true, group:'today', actionLabel:'Ver usuário', actionHref:'UsuarioDetalhe.dc.html' },
      { id:2, cat:'billing', icon:'💳', iconBg:'rgba(239,68,68,.12)', iconColor:'#ef4444', title:'Falha de pagamento', body:'A cobrança de Rafael Nunes (Start) foi recusada.', time:'há 22 min', baseUnread:true, group:'today', actionLabel:'Ver cobrança', actionHref:'Assinaturas.dc.html' },
      { id:3, cat:'system', icon:'⚡', iconBg:'rgba(245,95,22,.14)', iconColor:'#F55F16', title:'Importação concluída', body:'38 alimentos da base TACO foram adicionados com sucesso.', time:'há 1 hora', baseUnread:true, group:'today', actionLabel:'Ver alimentos', actionHref:'Alimentos.dc.html' },
      { id:4, cat:'users', icon:'🎯', iconBg:'rgba(22,163,74,.12)', iconColor:'#16a34a', title:'Marco de engajamento', body:'Amanda Costa completou 30 dias seguidos de treino.', time:'há 3 horas', baseUnread:false, group:'today', actionLabel:'', actionHref:'#' },
      { id:5, cat:'system', icon:'🤖', iconBg:'rgba(124,58,237,.12)', iconColor:'#7c3aed', title:'Plano gerado por IA publicado', body:'O plano "Full Body em Casa" foi gerado e está ativo.', time:'ontem, 16:40', baseUnread:false, group:'earlier', actionLabel:'Ver plano', actionHref:'Treinos.dc.html' },
      { id:6, cat:'billing', icon:'💰', iconBg:'rgba(22,163,74,.12)', iconColor:'#16a34a', title:'142 renovações processadas', body:'O gateway processou as renovações mensais do dia.', time:'ontem, 09:00', baseUnread:false, group:'earlier', actionLabel:'', actionHref:'#' },
      { id:7, cat:'system', icon:'🔒', iconBg:'var(--surface-2)', iconColor:'var(--muted)', title:'Novo acesso à sua conta', body:'Login detectado via iPhone 15 em São Paulo.', time:'2 dias atrás', baseUnread:false, group:'earlier', actionLabel:'', actionHref:'#' },
    ];
  }

  renderVals(){
    const dark = this.state.theme === 'dark', F = this.state.filter;
    const seg = (on) => 'border:none;cursor:pointer;font-family:inherit;font-size:13px;font-weight:800;padding:7px 14px;border-radius:8px;white-space:nowrap;' + (on ? 'background:var(--brand);color:#fff;' : 'background:transparent;color:var(--muted);');

    const all = this.data().map(n => {
      const unread = (n.id in this.state.read) ? !this.state.read[n.id] : n.baseUnread;
      return { ...n, unread };
    });
    const unreadCount = all.filter(n => n.unread).length;

    let filtered = all;
    if (F === 'unread') filtered = all.filter(n => n.unread);
    else if (F !== 'all') filtered = all.filter(n => n.cat === F);

    const mkItem = (n) => ({
      ...n,
      weight: n.unread ? 800 : 600,
      rowBg: n.unread ? 'var(--brand-soft)' : 'transparent',
      hasAction: !!n.actionLabel,
      toggle: this.toggleRead(n.id),
    });
    const groupsDef = [ ['today','Hoje'], ['earlier','Anteriores'] ];
    const groups = groupsDef.map(([key,label]) => ({
      label, items: filtered.filter(n => n.group === key).map(mkItem),
    })).filter(g => g.items.length > 0);

    return {
      isDark: dark, isLight: !dark, toggleTheme: this.toggleTheme,
      markAll: this.markAll, hideToast: this.hideToast, toastShown: this.state.toast, toastMsg: this.state.toastMsg,
      pickAll: this.pick('all'), pickUnread: this.pick('unread'), pickUsers: this.pick('users'), pickBilling: this.pick('billing'), pickSystem: this.pick('system'),
      segAll: seg(F==='all'), segUnread: seg(F==='unread'), segUsers: seg(F==='users'), segBilling: seg(F==='billing'), segSystem: seg(F==='system'),
      countAll: all.length, countUnread: unreadCount,
      groups, hasItems: filtered.length > 0, isEmpty: filtered.length === 0,
    };
  }
}
</script>
</body>
</html>
