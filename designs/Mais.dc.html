<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{ --brand:#F55F16; --brand-hover:#FF7A3D; --brand-soft:rgba(245,95,22,.10);
    --bg:#F8F9FA; --surface:#FFFFFF; --surface-2:#F1F5F9; --border:#E2E8F0; --text:#1A202C; --muted:#718096; --field:#F8F9FA; }
  :root[data-theme="dark"]{ --bg:#121212; --surface:#1E1E1E; --surface-2:#2A2A2A; --border:#333333; --text:#DBD9D8; --muted:#9C9C9C; --field:#161616; --brand-soft:rgba(245,95,22,.14); }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;}
  ::-webkit-scrollbar{width:8px;height:8px;} ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;} ::-webkit-scrollbar-track{background:transparent;}
</style>
</helmet>

<div style="display:flex;height:100vh;width:100%;overflow:hidden;background:var(--bg);color:var(--text);">
  <div class="yb-side"><dc-import name="Sidebar" active="" hint-size="260px,100%"></dc-import></div>
  <dc-import name="MobileNav" active="mais" hint-size="0,0"></dc-import>

  <div style="flex:1;display:flex;flex-direction:column;min-width:0;">
    <header style="height:72px;flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 28px;gap:20px;">
      <div>
        <div style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-weight:600;"><span>Ybytu Admin</span><span>/</span><span style="color:var(--text);">Mais</span></div>
        <h2 style="margin:2px 0 0;font-size:18px;font-weight:900;">Mais</h2>
      </div>
      <button onClick="{{ toggleTheme }}" title="Alternar tema" style="width:40px;height:40px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;" style-hover="color:var(--brand);border-color:var(--brand);">
        <sc-if value="{{ isDark }}" hint-placeholder-val="{{ true }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path></svg></sc-if>
        <sc-if value="{{ isLight }}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg></sc-if>
      </button>
    </header>

    <main style="flex:1;overflow-y:auto;padding:28px;">
      <div style="max-width:680px;margin:0 auto;">

        <!-- Account card -->
        <a href="Conta.dc.html" style="display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:22px;text-decoration:none;color:inherit;" style-hover="border-color:var(--brand);">
          <div style="width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#F55F16,#FF7A3D);display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;font-size:19px;flex-shrink:0;">A</div>
          <div style="flex:1;min-width:0;"><p style="margin:0;font-size:16px;font-weight:800;">Admin Principal</p><p style="margin:2px 0 0;font-size:13px;color:var(--muted);">Acesso total · Ver minha conta</p></div>
          <span style="color:var(--muted);display:flex;flex-shrink:0;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg></span>
        </a>

        <sc-for list="{{ groups }}" as="g" hint-placeholder-count="3">
        <p style="margin:0 0 10px;font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;">{{ g.label }}</p>
        <div style="background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:22px;">
          <sc-for list="{{ g.items }}" as="m" hint-placeholder-count="4">
          <a href="{{ m.href }}" style="display:flex;align-items:center;gap:14px;padding:15px 18px;border-bottom:1px solid var(--border);text-decoration:none;color:inherit;" style-hover="background:var(--surface-2);">
            <span style="width:38px;height:38px;border-radius:10px;background:{{ m.bg }};color:{{ m.color }};display:flex;align-items:center;justify-content:center;flex-shrink:0;">{{ m.icon }}</span>
            <div style="flex:1;min-width:0;"><p style="margin:0;font-size:14.5px;font-weight:700;">{{ m.label }}</p><p style="margin:2px 0 0;font-size:12px;color:var(--muted);">{{ m.desc }}</p></div>
            <span style="color:var(--muted);display:flex;flex-shrink:0;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg></span>
          </a>
          </sc-for>
        </div>
        </sc-for>

      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:860}}">
class Component extends DCLogic {
  state = { theme: 'dark' };
  componentDidMount(){ this.applyTheme(); }
  applyTheme(){ try{ document.documentElement.dataset.theme = this.state.theme; }catch(e){} }
  toggleTheme = () => this.setState(s => ({ theme: s.theme === 'dark' ? 'light' : 'dark' }), this.applyTheme);

  ic(paths, extra){
    return React.createElement('svg', { width:19, height:19, viewBox:'0 0 24 24', fill:'none', stroke:'currentColor', strokeWidth:2, strokeLinecap:'round', strokeLinejoin:'round' },
      ...paths.map((d,i)=>React.createElement('path',{key:i,d})), ...(extra||[]));
  }

  renderVals(){
    const dark = this.state.theme === 'dark';
    const item = (icon, label, desc, href, bg, color) => ({ icon, label, desc, href, bg, color });
    return {
      isDark: dark, isLight: !dark, toggleTheme: this.toggleTheme,
      groups: [
        { label:'Gestão', items: [
          item(this.ic(['M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2','M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75'],[React.createElement('circle',{key:'c',cx:9,cy:7,r:4})]),'Usuários','Base de usuários e perfis','Usuarios.dc.html','rgba(59,130,246,.12)','#3b82f6'),
          item(this.ic(['M2 10h20'],[React.createElement('rect',{key:'r',x:2,y:5,width:20,height:14,rx:2})]),'Assinaturas','Planos, receita e cobrança','Assinaturas.dc.html','rgba(245,95,22,.14)','#F55F16'),
        ]},
        { label:'Módulo Treino', items: [
          item(this.ic(['M22 12h-4l-3 9L9 3l-3 9H2']),'Treinos (Planos)','Fichas e programas','Treinos.dc.html','rgba(245,95,22,.14)','#F55F16'),
          item(this.ic(['m6.5 6.5 11 11M21 21l-1-1M3 3l1 1M18 22l4-4M2 6l4-4M3 10l7-7M14 21l7-7']),'Equipamentos','Vocabulário de equipamentos','Equipamentos.dc.html','rgba(168,85,247,.12)','#a855f7'),
        ]},
        { label:'Módulo Nutrição', items: [
          item(this.ic(['M12 20.94c1.5 0 2.75-1.06 4-2.94 1.5-2.25 2-5.5 2-7 0-2.5-1.5-4-3.5-4-1.5 0-2.5 1-3 1.5-.5-.5-1.5-1.5-3-1.5C5 7 3.5 8.5 3.5 11c0 1.5.5 4.75 2 7 1.25 1.88 2.5 2.94 4 2.94Z','M10 2c1 .5 2 2 2 5']),'Refeições','Receitas e modos de preparo','Refeicoes.dc.html','rgba(22,163,74,.12)','#16a34a'),
          item(this.ic(['M3 2v7c0 1.1.9 2 2 2h2a2 2 0 0 0 2-2V2M7 2v20M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7']),'Planos Alimentares','Programas de refeições','PlanosAlimentares.dc.html','rgba(22,163,74,.12)','#16a34a'),
          item(this.ic(['M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z'],[React.createElement('circle',{key:'c',cx:7.5,cy:7.5,r:1.5})]),'Tags','Vocabulário de classificação','Tags.dc.html','rgba(59,130,246,.12)','#3b82f6'),
        ]},
        { label:'Sistema', items: [
          item(this.ic(['M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0']),'Notificações','Central de avisos','Notificacoes.dc.html','rgba(168,85,247,.12)','#a855f7'),
          item(this.ic(['M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z']),'Design System','Guia de estilo do painel','DesignSystem.dc.html','rgba(120,130,150,.16)','#9C9C9C'),
          item(this.ic(['M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2Z'],[React.createElement('circle',{key:'c',cx:12,cy:12,r:3})]),'Configurações','Conta, segurança, equipe','Conta.dc.html','rgba(120,130,150,.16)','#9C9C9C'),
        ]},
      ],
    };
  }
}
</script>
</body>
</html>
