<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{ --brand:#F55F16; --brand-hover:#FF7A3D; --brand-soft:rgba(245,95,22,.10);
    --bg:#F8F9FA; --surface:#FFFFFF; --surface-2:#F1F5F9; --border:#E2E8F0; --text:#1A202C; --muted:#718096; }
  :root[data-theme="dark"]{ --bg:#121212; --surface:#1E1E1E; --surface-2:#2A2A2A; --border:#333333; --text:#DBD9D8; --muted:#9C9C9C; --brand-soft:rgba(245,95,22,.14); }
</style>
</helmet>
<aside style="width:260px;flex-shrink:0;height:100%;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;font-family:'Inter',sans-serif;">
  <div style="height:72px;display:flex;align-items:center;gap:11px;padding:0 22px;border-bottom:1px solid var(--border);flex-shrink:0;">
    <span style="display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:9px;background:var(--brand);color:#fff;box-shadow:0 4px 12px rgba(245,95,22,.3);"><svg viewBox="119 94 275 323" style="width:20px;height:auto;" fill="currentColor"><path d="M256.5 94V151.633L341.5 199.817H341.462V267.839L394 250.881V229.584V199.817V171.951L256.5 94Z"/><path d="M119 199.817V229.584V250.881L171.538 267.839V199.817H171.5L256.5 151.633V94L119 171.951V199.817Z"/><path d="M119.153 277.633C118.789 279.803 119.153 321.189 119.153 321.189L170.253 341.142V385.774L256.5 416.981L341.999 385.774V340.778L394 323.359V277.633L307.216 309.935V352.396L256.5 373.08L207.202 356.391L206.838 309.935L119.153 277.633Z"/></svg></span>
    <span style="font-weight:900;font-size:17px;letter-spacing:.02em;color:var(--text);">Ybytu <span style="color:var(--brand);font-size:10px;font-weight:800;">ADMIN</span></span>
  </div>

  <nav style="flex:1;overflow-y:auto;padding:18px 0;">
    <p style="font-size:10px;font-weight:800;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;padding:0 22px;margin:8px 0 8px;">Visão Geral</p>
    <a href="Dashboard.dc.html" style="{{ navDash }}" style-hover="background:var(--surface-2);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"></rect><rect x="14" y="3" width="7" height="5" rx="1"></rect><rect x="14" y="12" width="7" height="9" rx="1"></rect><rect x="3" y="16" width="7" height="5" rx="1"></rect></svg> Dashboard
    </a>

    <p style="font-size:10px;font-weight:800;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;padding:0 22px;margin:20px 0 8px;">Gestão</p>
    <a href="Usuarios.dc.html" style="{{ navUsuarios }}" style-hover="background:var(--surface-2);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"></path></svg> Usuários
    </a>
    <a href="Assinaturas.dc.html" style="{{ navAssin }}" style-hover="background:var(--surface-2);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"></rect><path d="M2 10h20"></path></svg> Assinaturas
    </a>

    <p style="font-size:10px;font-weight:800;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;padding:0 22px;margin:20px 0 8px;">Módulo Treino</p>
    <a href="Exercicios.dc.html" style="{{ navExerc }}" style-hover="background:var(--surface-2);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6.5 6.5 11 11M21 21l-1-1M3 3l1 1M18 22l4-4M2 6l4-4M3 10l7-7M14 21l7-7"></path></svg> Exercícios
    </a>
    <a href="Treinos.dc.html" style="{{ navTreinos }}" style-hover="background:var(--surface-2);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg> Treinos (Planos)
    </a>
    <a href="Equipamentos.dc.html" style="{{ navEquip }}" style-hover="background:var(--surface-2);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="3"></circle><path d="M6.5 8a2 2 0 0 0-1.905 1.46L2.1 18.5A2 2 0 0 0 4 21h16a2 2 0 0 0 1.925-2.54L19.4 9.5A2 2 0 0 0 17.48 8Z"></path></svg> Equipamentos
    </a>

    <p style="font-size:10px;font-weight:800;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;padding:0 22px;margin:20px 0 8px;">Módulo Nutrição</p>
    <a href="Alimentos.dc.html" style="{{ navAlim }}" style-hover="background:var(--surface-2);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.94c1.5 0 2.75-1.06 4-2.94 1.5-2.25 2-5.5 2-7 0-2.5-1.5-4-3.5-4-1.5 0-2.5 1-3 1.5-.5-.5-1.5-1.5-3-1.5C5 7 3.5 8.5 3.5 11c0 1.5.5 4.75 2 7 1.25 1.88 2.5 2.94 4 2.94Z"></path><path d="M10 2c1 .5 2 2 2 5"></path></svg> Alimentos
    </a>
    <a href="Refeicoes.dc.html" style="{{ navRef }}" style-hover="background:var(--surface-2);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h2a2 2 0 0 0 2-2V2M7 2v20M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"></path></svg> Refeições
    </a>
    <a href="PlanosAlimentares.dc.html" style="{{ navPlanoAlim }}" style-hover="background:var(--surface-2);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11H3v10h6V11ZM21 3h-6v18h6V3ZM15 7H9v14h6V7Z"></path></svg> Planos Alimentares
    </a>
    <a href="Tags.dc.html" style="{{ navTags }}" style-hover="background:var(--surface-2);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"></path><circle cx="7.5" cy="7.5" r="1.5"></circle></svg> Tags
    </a>
  </nav>

  <div style="padding:14px;border-top:1px solid var(--border);flex-shrink:0;">
    <a href="Conta.dc.html" style="{{ accountStyle }}" style-hover="background:var(--surface-2);">
      <div style="width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#F55F16,#FF7A3D);display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;font-size:15px;flex-shrink:0;">A</div>
      <div style="flex:1;min-width:0;">
        <p style="margin:0;font-weight:700;font-size:13px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Admin Principal</p>
        <p style="margin:1px 0 0;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Ver minha conta</p>
      </div>
      <span style="color:var(--muted);display:flex;flex-shrink:0;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg></span>
    </a>
  </div>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:260,&quot;height&quot;:760},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dashboard&quot;,&quot;usuarios&quot;,&quot;assinaturas&quot;,&quot;exercicios&quot;,&quot;treinos&quot;,&quot;equipamentos&quot;,&quot;alimentos&quot;,&quot;refeicoes&quot;,&quot;planos-alimentares&quot;,&quot;tags&quot;,&quot;conta&quot;],&quot;default&quot;:&quot;exercicios&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals(){
    const active = this.props.active || '';
    const base = 'display:flex;align-items:center;gap:12px;padding:11px 22px;font-size:14px;font-weight:600;color:var(--text);text-decoration:none;';
    const on = 'display:flex;align-items:center;gap:12px;padding:11px 22px;font-size:14px;font-weight:700;color:var(--brand);background:var(--brand-soft);border-right:3px solid var(--brand);text-decoration:none;';
    const nav = (k) => active === k ? on : base;
    const accountBase = 'display:flex;align-items:center;gap:11px;padding:8px;border-radius:12px;text-decoration:none;';
    const accountOn = 'display:flex;align-items:center;gap:11px;padding:8px;border-radius:12px;text-decoration:none;background:var(--brand-soft);';
    return {
      accountStyle: active === 'conta' ? accountOn : accountBase,
      navDash: nav('dashboard'), navUsuarios: nav('usuarios'), navAssin: nav('assinaturas'),
      navExerc: nav('exercicios'), navTreinos: nav('treinos'), navEquip: nav('equipamentos'), navAlim: nav('alimentos'), navRef: nav('refeicoes'), navPlanoAlim: nav('planos-alimentares'), navTags: nav('tags'),
    };
  }
}
</script>
</body>
</html>
