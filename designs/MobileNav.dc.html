<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* ---- responsive shell rules (global, injected by MobileNav) ---- */
  .yb-mnav{ display:none; }
  @media(max-width:860px){
    .yb-side{ display:none !important; }
    .yb-mnav{ display:flex !important; }
    main{ padding-bottom:92px !important; }
    .yb-builder{ flex-direction:column !important; }
    .yb-libpanel{ width:100% !important; flex-shrink:0 !important; border-right:none !important; border-left:none !important; border-bottom:1px solid var(--border) !important; max-height:240px !important; }
  }
</style>
</helmet>
<nav class="yb-mnav" style="position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--surface);border-top:1px solid var(--border);padding:8px 8px calc(10px + env(safe-area-inset-bottom));justify-content:space-between;font-family:'Inter',sans-serif;box-shadow:0 -4px 20px rgba(0,0,0,.10);">
  <a href="Dashboard.dc.html" style="{{ sInicio }}">
    <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
    <span>Início</span>
  </a>
  <a href="Exercicios.dc.html" style="{{ sTreino }}">
    <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg>
    <span>Treino</span>
  </a>
  <a href="Alimentos.dc.html" style="{{ sNutricao }}">
    <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.94c1.5 0 2.75-1.06 4-2.94 1.5-2.25 2-5.5 2-7 0-2.5-1.5-4-3.5-4-1.5 0-2.5 1-3 1.5-.5-.5-1.5-1.5-3-1.5C5 7 3.5 8.5 3.5 11c0 1.5.5 4.75 2 7 1.25 1.88 2.5 2.94 4 2.94Z"></path><path d="M10 2c1 .5 2 2 2 5"></path></svg>
    <span>Nutrição</span>
  </a>
  <a href="Usuarios.dc.html" style="{{ sUsuarios }}">
    <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle></svg>
    <span>Usuários</span>
  </a>
  <a href="Mais.dc.html" style="{{ sMais }}">
    <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="19" cy="12" r="1.6"></circle></svg>
    <span>Mais</span>
  </a>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:80},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;inicio&quot;,&quot;treino&quot;,&quot;nutricao&quot;,&quot;usuarios&quot;,&quot;mais&quot;],&quot;default&quot;:&quot;inicio&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals(){
    const a = this.props.active || '';
    const base = 'flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;font-weight:700;text-decoration:none;padding:2px 0;color:var(--muted);';
    const on = 'flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;font-weight:800;text-decoration:none;padding:2px 0;color:var(--brand);';
    const s = (k) => a === k ? on : base;
    return { sInicio:s('inicio'), sTreino:s('treino'), sNutricao:s('nutricao'), sUsuarios:s('usuarios'), sMais:s('mais') };
  }
}
</script>
</body>
</html>
