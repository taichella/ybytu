<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{ --brand:#F55F16; --brand-hover:#FF7A3D; --brand-soft:rgba(245,95,22,.10);
    --bg:#F8F9FA; --surface:#FFFFFF; --surface-2:#F1F5F9; --border:#E2E8F0; --text:#1A202C; --muted:#718096; --field:#F8F9FA; }
  :root[data-theme="dark"]{ --bg:#121212; --surface:#1E1E1E; --surface-2:#2A2A2A; --border:#333333; --text:#DBD9D8; --muted:#9C9C9C; --field:#161616; --brand-soft:rgba(245,95,22,.14); }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;}
  ::-webkit-scrollbar{width:8px;height:8px;} ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;} ::-webkit-scrollbar-track{background:transparent;}
</style>
</helmet>

<div style="display:flex;height:100vh;width:100%;overflow:hidden;background:var(--bg);color:var(--text);">
  <div class="yb-side"><dc-import name="Sidebar" active="equipamentos" hint-size="260px,100%"></dc-import></div>
  <dc-import name="MobileNav" active="treino" hint-size="0,0"></dc-import>

  <div style="flex:1;display:flex;flex-direction:column;min-width:0;">
    <header style="height:72px;flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 28px;gap:20px;">
      <div style="position:relative;flex:1;max-width:420px;">
        <span style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);display:flex;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg></span>
        <input type="text" placeholder="Buscar equipamento…" style="width:100%;padding:10px 16px 10px 42px;border-radius:11px;background:var(--field);border:1px solid var(--border);color:var(--text);font-size:14px;font-family:inherit;outline:none;transition:border-color .2s,box-shadow .2s;" style-focus="border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft);">
      </div>
      <div style="display:flex;align-items:center;gap:10px;">
        <button onClick="{{ toggleTheme }}" title="Alternar tema" style="width:40px;height:40px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;" style-hover="color:var(--brand);border-color:var(--brand);">
          <sc-if value="{{ isDark }}" hint-placeholder-val="{{ true }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path></svg></sc-if>
          <sc-if value="{{ isLight }}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg></sc-if>
        </button>
        <button onClick="{{ openNew }}" style="display:flex;align-items:center;gap:7px;background:var(--brand);color:#fff;border:none;border-radius:11px;padding:10px 16px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;box-shadow:0 4px 12px rgba(245,95,22,.25);" style-hover="background:var(--brand-hover);">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg> Novo equipamento
        </button>
      </div>
    </header>

    <main style="flex:1;overflow-y:auto;padding:28px;">
      <div style="max-width:1120px;margin:0 auto;">
        <div style="margin-bottom:22px;">
          <div style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:4px;"><a href="Exercicios.dc.html" style="color:var(--muted);text-decoration:none;" style-hover="color:var(--brand);">Módulo Treino</a><span>/</span><span style="color:var(--text);">Equipamentos</span></div>
          <h1 style="font-size:28px;font-weight:900;letter-spacing:-.02em;margin:0;text-transform:uppercase;">Equipamentos</h1>
          <p style="color:var(--muted);font-size:14px;margin:5px 0 0;">Catálogo multilíngue usado para classificar exercícios e filtrar planos. <strong style="color:var(--text);">12</strong> equipamentos.</p>
        </div>

        <!-- New equipment inline form -->
        <sc-if value="{{ showNew }}" hint-placeholder-val="{{ false }}">
        <div style="background:var(--surface);border:1px solid var(--brand);border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:0 8px 30px rgba(245,95,22,.10);">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
            <h3 style="margin:0;font-size:15px;font-weight:900;text-transform:uppercase;letter-spacing:.02em;">Novo equipamento</h3>
            <button onClick="{{ closeNew }}" style="color:var(--muted);background:none;border:none;cursor:pointer;display:flex;padding:4px;" style-hover="color:var(--text);"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
          </div>
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;align-items:end;">
            <div><label style="display:block;font-size:11px;font-weight:800;margin-bottom:6px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;">ID</label><input type="text" placeholder="ex: kettlebell" style="width:100%;padding:11px 13px;border-radius:10px;background:var(--field);border:1px solid var(--border);color:var(--text);font-size:13px;font-family:monospace;outline:none;" style-focus="border-color:var(--brand);"></div>
            <div><label style="display:block;font-size:11px;font-weight:800;margin-bottom:6px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;">Nome 🇧🇷 PT</label><input type="text" placeholder="Kettlebell" style="width:100%;padding:11px 13px;border-radius:10px;background:var(--field);border:1px solid var(--border);color:var(--text);font-size:13px;font-family:inherit;font-weight:600;outline:none;" style-focus="border-color:var(--brand);"></div>
            <div><label style="display:block;font-size:11px;font-weight:800;margin-bottom:6px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;">Nome 🇬🇧 EN</label><input type="text" placeholder="Kettlebell" style="width:100%;padding:11px 13px;border-radius:10px;background:var(--field);border:1px solid var(--border);color:var(--text);font-size:13px;font-family:inherit;font-weight:600;outline:none;" style-focus="border-color:var(--brand);"></div>
            <div><label style="display:block;font-size:11px;font-weight:800;margin-bottom:6px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;">Nome 🇫🇷 FR</label><input type="text" placeholder="Kettlebell" style="width:100%;padding:11px 13px;border-radius:10px;background:var(--field);border:1px solid var(--border);color:var(--text);font-size:13px;font-family:inherit;font-weight:600;outline:none;" style-focus="border-color:var(--brand);"></div>
            <button onClick="{{ closeNew }}" style="background:var(--brand);color:#fff;border:none;border-radius:10px;padding:11px 18px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;white-space:nowrap;" style-hover="background:var(--brand-hover);">Adicionar</button>
          </div>
        </div>
        </sc-if>

        <!-- Table -->
        <div style="background:var(--surface);border:1px solid var(--border);border-radius:18px;overflow:hidden;">
          <div style="overflow-x:auto;">
            <table style="width:100%;border-collapse:collapse;white-space:nowrap;">
              <thead>
                <tr style="background:var(--bg);">
                  <th style="text-align:left;padding:13px 20px;font-size:11px;font-weight:800;letter-spacing:.05em;color:var(--muted);text-transform:uppercase;">ID</th>
                  <th style="text-align:left;padding:13px 16px;font-size:11px;font-weight:800;letter-spacing:.05em;color:var(--muted);text-transform:uppercase;">Nome (PT-BR)</th>
                  <th style="text-align:left;padding:13px 16px;font-size:11px;font-weight:800;letter-spacing:.05em;color:var(--muted);text-transform:uppercase;">Nome (EN)</th>
                  <th style="text-align:left;padding:13px 16px;font-size:11px;font-weight:800;letter-spacing:.05em;color:var(--muted);text-transform:uppercase;">Nome (FR)</th>
                  <th style="text-align:center;padding:13px 16px;font-size:11px;font-weight:800;letter-spacing:.05em;color:var(--muted);text-transform:uppercase;">Exercícios</th>
                  <th style="text-align:right;padding:13px 20px;font-size:11px;font-weight:800;letter-spacing:.05em;color:var(--muted);text-transform:uppercase;">Ações</th>
                </tr>
              </thead>
              <tbody>
                <sc-for list="{{ equipments }}" as="eq" hint-placeholder-count="8">
                <tr style="border-top:1px solid var(--border);" style-hover="background:var(--surface-2);">
                  <td style="padding:13px 20px;"><span style="display:inline-flex;align-items:center;gap:9px;"><span style="width:32px;height:32px;border-radius:9px;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;flex-shrink:0;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="3"></circle><path d="M6.5 8a2 2 0 0 0-1.905 1.46L2.1 18.5A2 2 0 0 0 4 21h16a2 2 0 0 0 1.925-2.54L19.4 9.5A2 2 0 0 0 17.48 8Z"></path></svg></span><span style="font-family:monospace;font-size:13px;color:var(--muted);">{{ eq.id }}</span></span></td>
                  <td style="padding:13px 16px;font-size:14px;font-weight:700;">{{ eq.pt }}</td>
                  <td style="padding:13px 16px;font-size:14px;color:var(--muted);font-weight:500;">{{ eq.en }}</td>
                  <td style="padding:13px 16px;font-size:14px;color:var(--muted);font-weight:500;">{{ eq.fr }}</td>
                  <td style="padding:13px 16px;text-align:center;"><span style="display:inline-flex;padding:3px 11px;border-radius:999px;font-size:12px;font-weight:800;background:var(--surface-2);color:var(--text);">{{ eq.count }}</span></td>
                  <td style="padding:13px 20px;text-align:right;white-space:nowrap;">
                    <button style="display:inline-flex;color:var(--muted);padding:6px;border-radius:8px;background:none;border:none;cursor:pointer;" style-hover="color:var(--brand);background:var(--brand-soft);"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path></svg></button>
                    <button style="color:var(--muted);background:none;border:none;cursor:pointer;padding:6px;border-radius:8px;margin-left:2px;" style-hover="color:#ef4444;background:rgba(239,68,68,.08);"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg></button>
                  </td>
                </tr>
                </sc-for>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:860}}">
class Component extends DCLogic {
  state = { theme: 'dark', showNew: false };
  componentDidMount(){ this.applyTheme(); }
  applyTheme(){ try{ document.documentElement.dataset.theme = this.state.theme; }catch(e){} }
  toggleTheme = () => this.setState(s => ({ theme: s.theme === 'dark' ? 'light' : 'dark' }), this.applyTheme);
  openNew = () => this.setState({ showNew: true });
  closeNew = () => this.setState({ showNew: false });

  renderVals(){
    const dark = this.state.theme === 'dark';
    const eq = (id,pt,en,fr,count) => ({ id,pt,en,fr,count });
    return {
      isDark: dark, isLight: !dark, toggleTheme: this.toggleTheme,
      showNew: this.state.showNew, openNew: this.openNew, closeNew: this.closeNew,
      equipments: [
        eq('bodyweight','Peso corporal','Bodyweight','Poids du corps', 128),
        eq('dumbbell','Halteres','Dumbbells','Haltères', 96),
        eq('barbell','Barra','Barbell','Barre', 74),
        eq('machine','Máquina','Machine','Machine', 88),
        eq('cable','Cabo/Polia','Cable','Câble', 52),
        eq('kettlebell','Kettlebell','Kettlebell','Kettlebell', 31),
        eq('band','Elástico','Resistance band','Élastique', 27),
        eq('bench','Banco','Bench','Banc', 44),
        eq('plate','Anilha','Weight plate','Disque', 19),
        eq('smith','Smith','Smith machine','Smith', 23),
      ],
    };
  }
}
</script>
</body>
</html>
