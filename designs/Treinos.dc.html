<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{ --brand:#F55F16; --brand-hover:#FF7A3D; --brand-soft:rgba(245,95,22,.10);
    --bg:#F8F9FA; --surface:#FFFFFF; --surface-2:#F1F5F9; --border:#E2E8F0; --text:#1A202C; --muted:#718096; --field:#F8F9FA; }
  :root[data-theme="dark"]{ --bg:#121212; --surface:#1E1E1E; --surface-2:#2A2A2A; --border:#333333; --text:#DBD9D8; --muted:#9C9C9C; --field:#161616; --brand-soft:rgba(245,95,22,.14); }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;}
  ::-webkit-scrollbar{width:8px;height:8px;} ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;} ::-webkit-scrollbar-track{background:transparent;}
</style>
</helmet>

<div style="display:flex;height:100vh;width:100%;overflow:hidden;background:var(--bg);color:var(--text);">
  <div class="yb-side"><dc-import name="Sidebar" active="treinos" hint-size="260px,100%"></dc-import></div>
  <dc-import name="MobileNav" active="treino" hint-size="0,0"></dc-import>

  <div style="flex:1;display:flex;flex-direction:column;min-width:0;">
    <header style="height:72px;flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 28px;gap:20px;">
      <div style="position:relative;flex:1;max-width:420px;">
        <span style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);display:flex;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg></span>
        <input type="text" placeholder="Buscar plano de treino…" style="width:100%;padding:10px 16px 10px 42px;border-radius:11px;background:var(--field);border:1px solid var(--border);color:var(--text);font-size:14px;font-family:inherit;outline:none;transition:border-color .2s,box-shadow .2s;" style-focus="border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft);">
      </div>
      <div style="display:flex;align-items:center;gap:10px;">
        <button onClick="{{ toggleTheme }}" title="Alternar tema" style="width:40px;height:40px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;" style-hover="color:var(--brand);border-color:var(--brand);">
          <sc-if value="{{ isDark }}" hint-placeholder-val="{{ true }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path></svg></sc-if>
          <sc-if value="{{ isLight }}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg></sc-if>
        </button>
        <a href="ConstrutorPlano.dc.html" style="display:flex;align-items:center;gap:7px;background:var(--brand);color:#fff;border:none;border-radius:11px;padding:11px 18px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;text-decoration:none;box-shadow:0 4px 12px rgba(245,95,22,.25);" style-hover="background:var(--brand-hover);">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg> Criar plano
        </a>
      </div>
    </header>

    <main style="flex:1;overflow-y:auto;padding:28px;">
      <div style="max-width:1240px;margin:0 auto;">
        <div style="margin-bottom:22px;">
          <h1 style="font-size:28px;font-weight:900;letter-spacing:-.02em;margin:0;text-transform:uppercase;">Planos de Treino</h1>
          <p style="color:var(--muted);font-size:14px;margin:5px 0 0;">Fichas multilíngues para atribuição aos usuários — criadas manualmente ou pela IA. <strong style="color:var(--text);">28</strong> planos.</p>
        </div>

        <!-- Tabs + AI filter -->
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;border-bottom:1px solid var(--border);margin-bottom:22px;">
          <div style="display:flex;gap:6px;overflow-x:auto;">
            <button onClick="{{ pickAll }}" style="{{ tabAll }}">Todos</button>
            <button onClick="{{ pickHip }}" style="{{ tabHip }}">Hipertrofia</button>
            <button onClick="{{ pickForca }}" style="{{ tabForca }}">Força</button>
            <button onClick="{{ pickEmag }}" style="{{ tabEmag }}">Emagrecimento</button>
            <button onClick="{{ pickRascunho }}" style="{{ tabRascunho }}">Rascunhos</button>
          </div>
          <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-weight:600;cursor:pointer;padding-bottom:8px;white-space:nowrap;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--brand)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v2M5.6 5.6l1.4 1.4M3 12h2M5.6 18.4l1.4-1.4M12 19v2M17 12h2M18.4 5.6 17 7M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z"></path></svg>
            Somente gerados por IA <input type="checkbox" style="width:16px;height:16px;accent-color:var(--brand);margin-left:2px;">
          </label>
        </div>

        <!-- Plans grid -->
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px;">
          <sc-for list="{{ plans }}" as="p" hint-placeholder-count="6">
          <div style="background:var(--surface);border:1px solid var(--border);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .2s,transform .15s;" style-hover="border-color:rgba(245,95,22,.5);transform:translateY(-2px);">
            <div style="height:84px;position:relative;overflow:hidden;background:{{ p.cover }};display:flex;align-items:flex-end;justify-content:space-between;padding:14px;">
              <svg viewBox="119 94 275 323" style="position:absolute;right:-26px;top:-26px;width:120px;opacity:.16;" fill="#fff"><path d="M256.5 94V151.633L341.5 199.817H341.462V267.839L394 250.881V229.584V199.817V171.951L256.5 94Z"/><path d="M119 199.817V229.584V250.881L171.538 267.839V199.817H171.5L256.5 151.633V94L119 171.951V199.817Z"/><path d="M119.153 277.633C118.789 279.803 119.153 321.189 119.153 321.189L170.253 341.142V385.774L256.5 416.981L341.999 385.774V340.778L394 323.359V277.633L307.216 309.935V352.396L256.5 373.08L207.202 356.391L206.838 309.935L119.153 277.633Z"/></svg>
              <span style="position:relative;display:inline-flex;padding:4px 10px;border-radius:7px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;background:rgba(0,0,0,.28);color:#fff;backdrop-filter:blur(4px);">{{ p.goal }}</span>
              <sc-if value="{{ p.ai }}" hint-placeholder-val="{{ false }}"><span style="position:relative;display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:7px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;background:rgba(255,255,255,.92);color:#7c3aed;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v2M5.6 5.6l1.4 1.4M3 12h2M5.6 18.4l1.4-1.4M12 19v2M17 12h2M18.4 5.6 17 7M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z"></path></svg> IA</span></sc-if>
            </div>
            <div style="padding:16px;flex:1;display:flex;flex-direction:column;">
              <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
                <h3 style="margin:0;font-size:16px;font-weight:900;line-height:1.2;">{{ p.name }}</h3>
                <span style="flex-shrink:0;display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;padding:3px 8px;border-radius:6px;background:{{ p.statusBg }};color:{{ p.statusColor }};text-transform:uppercase;">{{ p.status }}</span>
              </div>
              <!-- environments + level + langs -->
              <div style="display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 12px;">
                <span style="display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:7px;background:var(--surface-2);color:var(--muted);">{{ p.envIcon }} {{ p.env }}</span>
                <span style="display:inline-flex;padding:3px 9px;border-radius:7px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;background:{{ p.levelBg }};color:{{ p.levelColor }};">{{ p.level }}</span>
              </div>
              <p style="margin:0 0 14px;font-size:13px;color:var(--muted);line-height:1.5;flex:1;">{{ p.desc }}</p>
              <!-- metrics from schema: days_per_week, duration_minutes, users -->
              <div style="display:flex;gap:14px;margin-bottom:14px;flex-wrap:wrap;">
                <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:700;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg> {{ p.days }}×/sem</div>
                <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:700;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 6v6l4 2"></path></svg> {{ p.duration }}min</div>
                <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:700;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle></svg> {{ p.users }}</div>
              </div>
              <div style="display:flex;gap:8px;padding-top:14px;border-top:1px solid var(--border);">
                <a href="DetalhePlano.dc.html" style="flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:9px;border-radius:10px;background:var(--surface-2);color:var(--text);font-size:13px;font-weight:700;text-decoration:none;border:1px solid var(--border);" style-hover="border-color:var(--brand);color:var(--brand);"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg> Ver</a>
                <a href="ConstrutorPlano.dc.html" style="flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:9px;border-radius:10px;background:var(--brand-soft);color:var(--brand);font-size:13px;font-weight:800;text-decoration:none;" style-hover="background:var(--brand);color:#fff;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path></svg> Editar</a>
              </div>
            </div>
          </div>
          </sc-for>
        </div>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}">
class Component extends DCLogic {
  state = { theme: 'dark', tab: 'all' };
  componentDidMount(){ this.applyTheme(); }
  applyTheme(){ try{ document.documentElement.dataset.theme = this.state.theme; }catch(e){} }
  toggleTheme = () => this.setState(s => ({ theme: s.theme === 'dark' ? 'light' : 'dark' }), this.applyTheme);
  set = (tab) => () => this.setState({ tab });

  renderVals(){
    const dark = this.state.theme === 'dark', t = this.state.tab;
    const tab = (on) => 'border:none;background:none;cursor:pointer;font-family:inherit;font-size:14px;font-weight:700;padding:11px 16px;white-space:nowrap;border-bottom:2px solid ' + (on ? 'var(--brand);color:var(--brand);' : 'transparent;color:var(--muted);');
    const grad = ['linear-gradient(135deg,#F55F16,#FF7A3D)','linear-gradient(135deg,#3b82f6,#60a5fa)','linear-gradient(135deg,#16a34a,#4ade80)','linear-gradient(135deg,#a855f7,#c084fc)','linear-gradient(135deg,#0E0E0E,#3a3a3a)','linear-gradient(135deg,#ef4444,#f87171)'];
    const ACT = { status:'Ativo', statusBg:'rgba(22,163,74,.12)', statusColor:'#16a34a' };
    const DRF = { status:'Rascunho', statusBg:'var(--surface-2)', statusColor:'var(--muted)' };
    const LV = {
      ini:  { level:'Iniciante',     levelBg:'var(--surface-2)',     levelColor:'var(--muted)' },
      inter:{ level:'Intermediário', levelBg:'rgba(59,130,246,.12)', levelColor:'#3b82f6' },
      av:   { level:'Avançado',      levelBg:'rgba(245,95,22,.14)',  levelColor:'#F55F16' },
    };
    const p = (name,goal,desc,env,envIcon,lv,days,duration,users,cover,ai,st) => ({ name,goal,desc,env,envIcon,days,duration,users,cover,ai,...LV[lv],...st });
    return {
      isDark: dark, isLight: !dark, toggleTheme: this.toggleTheme,
      pickAll:this.set('all'),pickHip:this.set('hip'),pickForca:this.set('forca'),pickEmag:this.set('emag'),pickRascunho:this.set('rascunho'),
      tabAll:tab(t==='all'),tabHip:tab(t==='hip'),tabForca:tab(t==='forca'),tabEmag:tab(t==='emag'),tabRascunho:tab(t==='rascunho'),
      plans: [
        p('Hipertrofia 12 Semanas','Hipertrofia','Programa ABC focado em volume progressivo para ganho de massa.','Academia','🏋️','av',5,52,'1.240', grad[0], false, ACT),
        p('Full Body em Casa','Condicionamento','Corpo inteiro sem equipamentos, ideal para treinar em casa.','Casa','🏠','ini',3,35,'3.880', grad[1], true, ACT),
        p('Cutting Definição','Emagrecimento','Treino metabólico com circuitos para perda de gordura.','Academia','🏋️','inter',4,45,'920', grad[2], false, ACT),
        p('Força Powerbuilding','Força','Base de força nos básicos (agacho, supino, terra) + acessórios.','Academia','🏋️','av',4,60,'610', grad[3], false, ACT),
        p('Corrida & Mobilidade','Condicionamento','Sessões ao ar livre combinando corrida e mobilidade.','Ar livre','🌳','ini',5,30,'1.510', grad[4], true, ACT),
        p('Glúteos em Foco','Hipertrofia','Programa de membros inferiores com ênfase em glúteos.','Casa','🏠','inter',4,40,'0', grad[5], true, DRF),
      ],
    };
  }
}
</script>
</body>
</html>
