  // livre sem validação nem DDI -- número de outro país (Portugal, França)
  // não tinha como ser conferido nem normalizado antes de gravar.
  const PRIORITY_COUNTRIES = ['BR', 'PT', 'FR'];
  // Fallback pros 3 principais + qualquer outro país, caso Intl.DisplayNames
  // não exista no navegador (não deveria acontecer -- suportado desde
  // 2021 nos principais engines -- mas nunca deixa a tela quebrar por isso).
  const FALLBACK_COUNTRY_NAMES = { BR: 'Brasil', PT: 'Portugal', FR: 'França' };
  let countryNameFormatter = null;
  try { countryNameFormatter = new Intl.DisplayNames(['pt'], { type: 'region' }); } catch (e) { /* segue sem, usa fallback */ }
  const getCountryLabel = (iso) => {
    if (countryNameFormatter) {
      try {
        const name = countryNameFormatter.of(iso);
        if (name && name !== iso) return name;
      } catch (e) { /* ISO não reconhecido pelo formatter, cai no fallback */ }
    }
    return FALLBACK_COUNTRY_NAMES[iso] || iso;
  };
  const getFlagEmoji = (iso) => {
    try {
      return String.fromCodePoint(...[...String(iso).toUpperCase()].map((c) => 127397 + c.charCodeAt(0)));
    } catch (e) { return ''; }
  };
  // Lista construída 1x (não muda em runtime) -- BR/PT/FR no topo, resto em
  // ordem alfabética pt-BR, com busca feita no próprio array na hora de renderizar.
  const ALL_COUNTRIES = (() => {
    if (!window.libphonenumber) return [];
    const isos = window.libphonenumber.getCountries();
    const list = isos.map((iso) => ({
      iso,
      name: getCountryLabel(iso),
      dial: `+${window.libphonenumber.getCountryCallingCode(iso)}`,
      flag: getFlagEmoji(iso),
    }));
    const byIso = Object.fromEntries(list.map((c) => [c.iso, c]));
    const priority = PRIORITY_COUNTRIES.map((iso) => byIso[iso]).filter(Boolean);
    const rest = list
      .filter((c) => !PRIORITY_COUNTRIES.includes(c.iso))
      .sort((a, b) => a.name.localeCompare(b.name, 'pt-BR'));
    return [...priority, ...rest];
  })();

  // Valida + normaliza um número digitado livremente (espaço, parêntese,
  // traço, zero inicial tipo "06 12 34 56 78") contra o país escolhido no
  // seletor. Se a pessoa colar um número já com "+DDI", usa esse DDI (ignora
  // o país selecionado) -- quem chama atualiza o seletor a partir de
  // result.detectedCountry quando isso acontece.
  const getPhoneValidation = (rawValue, countryIso) => {
    const raw = String(rawValue || '').trim();
    if (!raw) return { error: null, e164: null, preview: null, detectedCountry: null };
    if (!window.libphonenumber) {
      // Lib de CDN não carregou -- nunca trava o formulário por causa de um
      // recurso externo fora do ar, só não valida/normaliza desta vez.
      return { error: null, e164: raw, preview: raw, detectedCountry: null };
    }
    const parsed = raw.startsWith('+')
      ? window.libphonenumber.parsePhoneNumberFromString(raw)
      : window.libphonenumber.parsePhoneNumberFromString(raw, countryIso);
    if (!parsed || !parsed.isValid()) {
      return {
        error: `Número inválido para ${getCountryLabel(countryIso)}. Confira o DDD/código de área.`,
        e164: null,
        preview: null,
        detectedCountry: null,
      };
    }
    return {
      error: null,
      e164: parsed.number, // E.164 com "+" -- ver _shared/whatsapp.ts (Meta aceita com "+")
      preview: parsed.formatInternational(),
      detectedCountry: parsed.country || null,
    };
  };

  // Mascara o WhatsApp (já em E.164) exibido na tela de confirmação -- DDI
  // sempre visível, resto mascarado exceto os 2 últimos dígitos; número
  // curto nunca aparece inteiro (mascara pelo menos 1 dígito sempre).
  // Achado 2026-09-17: a versão antiga mascarava o texto cru (sem "+"/DDI
  // reconhecíveis), agora opera sobre o E.164 normalizado no submit.
  const maskPhone = (phone) => {
    const raw = String(phone || '').trim();
    if (!raw) return raw;
    const parsed = window.libphonenumber && window.libphonenumber.parsePhoneNumberFromString(raw);
    if (!parsed) {
      // Fallback bruto -- não deveria acontecer pra dado já validado no submit.
      if (raw.length < 7) return raw;
      return `${raw.slice(0, 4)}${'•'.repeat(Math.max(raw.length - 6, 0))}${raw.slice(-2)}`;
    }
    const cc = `+${parsed.countryCallingCode}`;
    const national = parsed.nationalNumber;
    if (national.length <= 4) {
      return `${cc} ${'•'.repeat(Math.max(national.length - 1, 1))}${national.slice(-1)}`;
    }
    return `${cc} ${'•'.repeat(national.length - 2)}${national.slice(-2)}`;
  };

      training_duration_minutes: 45,
      // Mesmo bug do slider acima, achado 2026-09-17: quem não arrasta o

      // undefined -- training_days_per_week/nutrition_days_per_week ficam no

    });

    // WhatsApp internacional -- país do seletor (DDI), separado de answers

    const [whatsappCountry, setWhatsappCountry] = useState('BR');

    // Só usado depois que o profile já foi salvo com sucesso (tela de

    useEffect(() => {
      async function fetchAllOptions() {
        try {
          const updatedSteps = await Promise.all(steps.map(async (step) => {
            if (step.table) {
              const { data, error } = await supabase.from(step.table).select('*').order('sort_order');
              if (error || !data) return step;
              let mapped = data.map(item => ({
                ...item,
                id: item.id || item[Object.keys(item).find(k => k.includes('id'))],
                name_ptbr: item.name_ptbr || item.label_ptbr || item.name || item.title,
                name: item.name_ptbr || item.label_ptbr || item.name || item.title
              }));
              // PASSO 17 (dietary_restrictions): carne suína/vermelha, peixe e
              // frutos do mar já são cobertos pela pergunta de preferência
              // alimentar (vegano/vegetariano/pescetariano etc via
              // DIETARY_RESTRICTION_BLOCKS_BY_PREFERENCE) -- oferecer de novo
              // aqui é redundante e confunde quem já respondeu. Removido
              // 2026-08-22 a pedido da Taina.
              if (step.dbField === 'dietary_restrictions_ids') {
                const REDUNDANT_WITH_PREFERENCE = ['sem carne suína', 'sem carne vermelha', 'sem frutos do mar', 'sem peixe'];
                mapped = mapped.filter(o => !REDUNDANT_WITH_PREFERENCE.includes(String(o.name_ptbr || '').trim().toLowerCase()));

              return { ...step, options: mapped };
            }
            return step;
          }));
          setSteps(updatedSteps);

    const visibleSteps = useMemo(() => steps.filter(step => step.condition ? step.condition(answers, steps) : true), [answers, steps]);

    // "Nenhuma"/"Nenhum" é detectado pelo nome vindo do banco, não por uma
    // lista fixa de tabelas -- assim a exclusão mútua vale pra qualquer
    // pergunta múltipla que tenha essa opção, inclusive se o catálogo mudar.
    const findNoneOption = (options) => (options || []).find(o => {
      const label = String(o.name_ptbr || o.name || '').trim().toLowerCase();
      return label === 'nenhuma' || label === 'nenhum';

    // IDs de dietary_restrictions que ficam bloqueados dada a preferência
    // alimentar escolhida (answers.dietary_preference_id guarda o uuid da

    const getBlockedRestrictionIds = (preferenceOptionId) => {
      if (!preferenceOptionId) return [];
      const prefOptions = steps.find(s => s.dbField === 'dietary_preference_id')?.options || [];

      return restrictionOptions
        .filter(o => blockedLabels.includes(String(o.name_ptbr || o.name || '').trim().toLowerCase()))
        .map(o => o.id);
    };

    const handleSelect = (optionId) => {
      const stepData = visibleSteps[currentStep];

      if (stepData.type === 'multiple') {
        const noneOption = findNoneOption(stepData.options);

          // Selecionar "Nenhuma" desmarca e desabilita as outras.
          newSelections = selections.includes(optionId) ? [] : [optionId];
        } else {
          // Selecionar qualquer outra desmarca "Nenhuma".
          const withoutNone = noneOption ? selections.filter(i => i !== noneOption.id) : selections;
          newSelections = withoutNone.includes(optionId) ? withoutNone.filter(i => i !== optionId) : [...withoutNone, optionId];

        setAnswers({ ...answers, [field]: newSelections });
      } else if (field === 'dietary_preference_id') {
        // Trocar a preferência limpa restrições que já ficaram implícitas/
        // redundantes -- senão fica um estado inválido salvo (ex: vegano com

        const blockedIds = getBlockedRestrictionIds(optionId);
        const currentRestrictions = answers.dietary_restrictions_ids || [];
        setAnswers({
          ...answers,
          [field]: optionId,
          dietary_restrictions_ids: currentRestrictions.filter(id => !blockedIds.includes(id)),
        });
      } else {
        setAnswers({ ...answers, [field]: optionId });
      }
    };

    const isNextDisabled = () => {
      const stepData = visibleSteps[currentStep];
      const value = answers[stepData.dbField];
      if (stepData.type === 'form') {
        if (!answers.first_name || !answers.last_name || !answers.email || !answers.whatsapp_phone) return true;
        // Número inválido bloqueia PRÓXIMO -- nunca segue em silêncio com um
        // WhatsApp que a Meta vai rejeitar na hora de notificar o aluno.
        return !!getPhoneValidation(answers.whatsapp_phone, whatsappCountry).error;
      }
      // 'single' e 'multiple' cobrem todas as perguntas de catálogo (gênero,
      // condições físicas, objetivos, etc.) -- sem isso o usuário avançava
      // sem responder e o perfil ficava com campo nulo/"incompleto" no
      // dashboard, sem nenhum aviso. Perguntas com opção "Nenhuma" exigem
      // escolher explicitamente "Nenhuma", não deixar em branco.
      if (stepData.type === 'single') {
        return value === undefined || value === null || value === '';
      }
      if (stepData.type === 'multiple') {
        return !Array.isArray(value) || value.length === 0;
      }
      if (stepData.type === 'number') {
        return value === undefined || value === null || value === '' || isNaN(Number(value));
      }
      // 'text' (disliked_foods) e 'slider' (training_duration_minutes) ficam
      // opcionais de propósito -- texto livre tem subtítulo dizendo "deixe em
      // branco", e o slider sempre carrega um valor default (recommended).
      return false;
    };

    // Não é mais chamado automaticamente no fim do formulário (ver item 3a:
    // essa mensagem nunca foi lida por nenhum código nosso -- o webhook só
    // processa callback de entrega dos templates que A GENTE manda, nunca
    // reage a mensagem recebida). Fica como botão OPCIONAL na tela de
    // confirmação, pra quem quiser abrir uma conversa com a equipe.
    const openTeamWhatsApp = () => {
      const message = encodeURIComponent(`Olá! Sou o ${userName} e acabei de finalizar meu perfil na plataforma.`);
      window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${message}`, '_blank', 'noopener');
    };

    // Guarda contra duplo clique -- achado 2026-09-17 (revisão Antigravity):
    // o botão FINALIZAR só desabilitava por isNextDisabled() (campos
    // preenchidos), não pelo estado de submissão em andamento -- um segundo
    // clique durante o await disparava um segundo signUp/upsert em paralelo.
    // useRef (não state) porque não precisa re-render, só bloquear reentrância.
    const submittingRef = React.useRef(false);

    const nextStep = async () => {
      if (isNextDisabled()) return;

      if (currentStep < visibleSteps.length - 1) {
        setCurrentStep(currentStep + 1);
      } else {
        if (submittingRef.current) return;
        submittingRef.current = true;
        setLoading(true);
        try {
          const email = answers.email?.trim();
          const firstName = answers.first_name?.trim();
          const lastName = answers.last_name?.trim();
          // Normaliza pro E.164 (com "+") na hora de submeter -- isNextDisabled
          // já bloqueou PRÓXIMO se inválido, então getPhoneValidation aqui só
          // formaliza o valor que a tela já mostrou como "vai ficar assim".
          const phoneValidation = getPhoneValidation(answers.whatsapp_phone, whatsappCountry);
          const whatsappPhone = phoneValidation.e164 || answers.whatsapp_phone?.trim();

          // 1. Criar conta — senha gerada, invisível, nunca guardada por nós.
          // Se o usuário precisar voltar depois, o caminho é reset de senha por
          // e-mail (ele nunca soube esta senha pra "lembrar" dela).
          const generatedPassword = crypto.randomUUID();

          const { data: signUpData, error: signUpError } = await supabase.auth.signUp({
            email,
            password: generatedPassword,
            options: {
              data: {
                full_name: `${firstName} ${lastName}`.trim(),
                first_name: firstName,
                last_name: lastName,
              }
            }
          });

          if (signUpError) {
            if (signUpError.message?.toLowerCase().includes('already registered')) {
              alert('Este e-mail já tem um perfil por aqui. Verifique seu WhatsApp ou fale com a gente.');
              return;
            }
            throw new Error('Erro ao criar conta: ' + signUpError.message);
          }

          // Supabase pode "suceder" com identities vazio quando o e-mail já
          // existe (proteção anti-enumeração) — mesmo caso do erro acima.
          if (signUpData?.user?.identities && signUpData.user.identities.length === 0) {
            alert('Este e-mail já tem um perfil por aqui. Verifique seu WhatsApp ou fale com a gente.');
            return;
          }

          if (!signUpData?.session) {
            // Achado 2026-09-17 (revisão Antigravity): esse return ficava
            // silencioso (só o alert, sem log) -- se "Confirm email" for
            // ligado no Supabase Auth, TODO onboarding cai aqui e ninguém
            // saberia por quê sem esse log. Ver docs/CHECKLIST_PRIMEIRO_ALUNO_REAL.md.
            console.error('signUp não retornou session -- "Confirm email" pode estar ligado no Supabase Auth (Authentication > Providers > Email). Onboarding não pode prosseguir sem sessão imediata.', { userId: signUpData?.user?.id });
            alert('Conta criada! Confirme seu e-mail para continuar.');
            return;
          }

          const userId = signUpData.user.id;

          const withTimeout = (promise, ms) => Promise.race([
            promise,
            new Promise((resolve) => setTimeout(() => resolve({ timedOut: true }), ms)),
          ]);

          // 2. Salva o perfil E dispara a geração numa ÚNICA chamada pro
          // servidor -- achado 2026-09-17 (revisão Antigravity, caso real
          // "Rayan Road"): antes disso o navegador salvava o perfil aqui e
          // depois chamava meal → training em sequência, um await por vez.
          // Se a aba fechasse entre as duas chamadas, a segunda nunca
          // disparava, e não havia rede de segurança pra notar depois
          // (plan_generation_status ficava 'pending' pra sempre). Agora
          // ybytu-onboarding-complete faz upsert+update do perfil e roda a
          // geração INTEIRA no servidor antes de responder -- fechar a aba
          // depois de chamar isto não interrompe mais nada.
          //
          // pregnancy_trimester e exercise_equipments_ids só são mandados se
          // a etapa que os preenche está VISÍVEL no momento do FINALIZAR --
          // um resquício de resposta de uma condição que a pessoa desmarcou
          // depois (ex: marcou "Gravidez", escolheu o trimestre, desmarcou
          // "Gravidez" de novo) não deve sobreviver no perfil salvo.
          const isPregnancyVisible = steps.find(s => s.id === 'pregnancy_trimester')?.condition(answers, steps) ?? false;
          const isEquipmentsVisible = steps.find(s => s.id === 'exercise_equipments')?.condition(answers, steps) ?? false;
          // Rede de segurança antes do envio (achado 2026-09-17, revisão
          // Antigravity) -- handleSelect já limpa isso quando a preferência
          // muda e a etapa de restrições já desabilita as opções bloqueadas,
          // então hoje não há caminho conhecido pra um id bloqueado sobreviver
          // até aqui, mas o filtro é barato e blinda contra um futuro
          // reordenamento de steps ou um bug nessas duas defesas.
          const blockedRestrictionIdsAtSubmit = getBlockedRestrictionIds(answers.dietary_preference_id);
          const safeDietaryRestrictions = (answers.dietary_restrictions_ids || [])
            .filter((id) => !blockedRestrictionIdsAtSubmit.includes(id));

          // subscription_type_id NÃO é mandado por aqui -- vira DEFAULT da
          // coluna no banco (piloto só oferece COMPLETE, ver migration
          // 20260917104200); ybytu-onboarding-complete lê subscription_type_id
          // JÁ GRAVADO no banco pra decidir treino/nutrição, nunca mais um
          // valor local do client (essa suposição -- client sempre "acha" que
          // é COMPLETE -- foi a causa raiz do caso Rayan Road).
          const { data: completeResult, error: completeError } = await withTimeout(
            supabase.functions.invoke('ybytu-onboarding-complete', {
              body: {
                profile: {
                  identity: {
                    full_name: `${firstName} ${lastName}`.trim(),
                    first_name: firstName,
                    last_name: lastName,
                    whatsapp_phone: whatsappPhone,
                  },
                  onboarding: {
                    goals_ids: answers.goals_ids || [],
                    gender_id: answers.gender_id,
                    age: answers.age,
                    weight_kg: answers.weight_kg,
                    height_cm: answers.height_cm,
                    activity_level_id: answers.activity_level_id,
                    health_conditions_ids: answers.health_conditions_ids || [],
                    pregnancy_trimester: isPregnancyVisible ? answers.pregnancy_trimester : null,
                    physical_conditions_ids: answers.physical_conditions_ids || [],
                    muscle_groups_ids: answers.muscle_groups_ids || [],
                    exercise_environment_id: answers.exercise_environment_id,
                    exercise_equipments_ids: isEquipmentsVisible ? (answers.exercise_equipment_ids || []) : [],
                    training_duration_minutes: answers.training_duration_minutes,
                    exercise_level_id: answers.exercise_level_id,
                    training_days_per_week: answers.dedicated_days_per_week,
                    nutrition_days_per_week: answers.dedicated_days_per_week,
                    meals_per_day: answers.meals_per_day,
                    dietary_preference_id: answers.dietary_preference_id,
                    dietary_restrictions_ids: safeDietaryRestrictions,
                    disliked_foods: answers.disliked_foods,
                  },
                },
              },
            }),
            20000,
          );

          // Timeout de 20s: NÃO é erro -- o perfil já foi salvo no servidor
          // antes da geração começar (passo 1 de ybytu-onboarding-complete),
          // e a geração real leva 13-57s medidos em produção, bem dentro do
          // limite de 150s das Edge Functions. Se o client desistir de
          // esperar, a orquestração continua rodando no servidor mesmo assim
          // -- o cron de retomada (a cada 15min) cobre qualquer caso raro que
          // realmente tenha travado.
          if (completeResult?.timedOut) {
            console.error('ybytu-onboarding-complete não respondeu em 20s -- seguindo mesmo assim, geração continua no servidor.');
          } else if (completeError) {
            // Erro de verdade (perfil não foi salvo, ou token inválido) --
            // este sim trava o fluxo, diferente do timeout acima.
            throw new Error('Erro ao salvar perfil/gerar plano: ' + completeError.message);
          } else if (completeResult?.data?.error) {
            throw new Error('Erro ao salvar perfil/gerar plano: ' + completeResult.data.error);
          }

          // 3. Avisa usuário ("recebemos seu perfil, estamos montando") e
          // sales ("novo aluno completou onboarding") — fire-and-forget.
          // Sem await de propósito: não é crítico como o passo 2 acima.
          supabase.functions.invoke('ybytu-notify-onboarding-received').catch((e) => console.error(e));

          // 4. Email de confirmação + recapitulativo (Resend) — aguardado com
          // timeout, pra saber na hora de montar a tela de confirmação se o
          // e-mail realmente foi enviado. emailSent alimenta a tela abaixo.
          let emailSent = false;
          try {
            const emailResult = await withTimeout(supabase.functions.invoke('ybytu-send-onboarding-email'), 5000);
            // emailSent só vira true pela confirmação REAL do corpo
            // (ybytu-send-onboarding-email responde {ok:true, resend_id} no
            // sucesso) -- nunca pela ausência de erro sozinha.
            emailSent = emailResult?.data?.ok === true;
            if (emailResult?.timedOut) console.error('ybytu-send-onboarding-email não respondeu em 5s (timeout)');
            else if (emailResult?.error) console.error('ybytu-send-onboarding-email retornou erro:', emailResult.error);
            else if (!emailSent) console.error('ybytu-send-onboarding-email respondeu sem ok:true (corpo inesperado):', emailResult?.data);
          } catch (e) {
            console.error('ybytu-send-onboarding-email falhou:', e);
          }

          // 5. Gera o link compartilhável (/plano/<token>) na hora, em vez de
          // alguém ter que criar a linha em plan_share_tokens na mão pra
          // conseguir revisar/testar o plano depois -- fail-soft (aviso ao
          // staff de que há parecer pendente já rodou DENTRO de
          // ybytu-onboarding-complete, server-side, não depende mais do
          // client sobreviver até aqui).
          const shareTokenResult = await withTimeout(supabase.functions.invoke('ybytu-create-plan-share-token'), 5000);
          if (shareTokenResult?.timedOut) console.error('ybytu-create-plan-share-token não respondeu em 5s (timeout) -- seguindo mesmo assim (fail-soft)');
          else if (shareTokenResult?.error) console.error('ybytu-create-plan-share-token falhou:', shareTokenResult.error);

          // 6. Mostra a tela de confirmação -- SEM redirect automático pro
          // WhatsApp (achado 2026-09-17, ver item 3a: whatsapp-webhook nunca
          // reage a mensagem recebida, não é opt-in nem abre janela de 24h
          // pra nada que a gente manda depois -- é sempre template HSM
          // business-initiated. O botão de WhatsApp na tela de confirmação é
          // opcional). Mostra mesmo se a geração ou as notificações acima
          // falharam (fail-soft) -- o aluno já está com o profile salvo.
          setFinished({ firstName, email, whatsappPhone, emailSent });
        } catch (e) {
          alert(e.message || "Ocorreu um erro ao salvar o perfil.");
          console.error(e);
        } finally {
          setLoading(false);
          submittingRef.current = false;
        }
      }
    };

    if (loading) {
      return (
        <div className="flex w-full py-20 bg-bgBody justify-center items-center rounded-xl">
          <div className="w-12 h-12 border-4 border-brand border-t-transparent rounded-full animate-spin"></div>
        </div>
      );
    }

    // Tela final -- substitui o formulário inteiro, sem caminho de volta.
    if (finished) {
      return (
        <div className="flex w-full bg-bgBody justify-center items-center font-sans p-2 rounded-xl">
          <div className="flex flex-col w-full max-w-2xl bg-bgBody shadow-lg rounded-xl sm:border sm:border-borderColor overflow-hidden">
            <div className="px-4 sm:px-8 pt-10 pb-8">
              <span className="inline-flex w-14 h-14 rounded-full bg-green-100 items-center justify-center text-green-600 mb-5">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6 9 17l-5-5" /></svg>
              </span>
              <h1 className="text-2xl font-black text-textMain mb-2 leading-tight">Perfil confirmado, {finished.firstName}!</h1>
              <p className="text-textMuted mb-7">Recebemos suas respostas. Aqui está o que acontece agora:</p>

              <div className="flex flex-col gap-4 mb-6">
                <div className="flex gap-3 items-start">
                  <span className="flex-shrink-0 w-6 h-6 rounded-full bg-brand text-white flex items-center justify-center text-xs font-bold">1</span>
                  <p className="m-0 text-sm leading-relaxed pt-0.5"><strong>Seu plano já está sendo gerado</strong> com base nas suas respostas.</p>
                </div>
                <div className="flex gap-3 items-start">
                  <span className="flex-shrink-0 w-6 h-6 rounded-full bg-brand text-white flex items-center justify-center text-xs font-bold">2</span>
                  <p className="m-0 text-sm leading-relaxed pt-0.5"><strong>Um personal trainer e uma nutricionista revisam</strong> tudo antes de liberar pra você.</p>
                </div>
                <div className="flex gap-3 items-start">
                  <span className="flex-shrink-0 w-6 h-6 rounded-full bg-brand text-white flex items-center justify-center text-xs font-bold">3</span>
                  <p className="m-0 text-sm leading-relaxed pt-0.5"><strong>O link do plano chega pelo seu WhatsApp</strong> assim que a revisão terminar.</p>
                </div>
              </div>

              <div className="bg-surface border border-borderColor rounded-xl px-4 py-3 mb-6 flex gap-2.5 items-center">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-brand flex-shrink-0"><circle cx="12" cy="12" r="10" /><path d="M12 6v6l4 2" /></svg>
                <p className="m-0 text-sm"><strong>Prazo de revisão:</strong> em até 48 horas</p>
              </div>

              <div className="border-t border-borderColor pt-5 mb-4">
                <p className="m-0 mb-1 text-xs text-textMuted font-bold uppercase tracking-wide">Vamos te avisar pelo WhatsApp</p>
                <p className="m-0 text-sm">
                  {maskPhone(finished.whatsappPhone)}
                  {' · '}
                  <a href={`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(`Olá, sou ${finished.firstName} -- o número de WhatsApp que cadastrei está errado, poderiam me ajudar a corrigir?`)}`} target="_blank" rel="noopener" className="text-brand font-bold no-underline">Número errado? Fale com a gente</a>
                </p>
              </div>

              {finished.emailSent && (
                <p className="text-sm text-textMuted leading-relaxed mb-4">Também enviamos um e-mail de confirmação com esse resumo para <strong className="text-textMain">{finished.email}</strong>.</p>
              )}

              <div className="bg-surface rounded-xl px-4 py-3">
                <p className="m-0 mb-1 text-sm font-bold">Não recebeu o link dentro do prazo?</p>
                <p className="m-0 text-sm text-textMuted leading-relaxed">
                  Confira se o número do WhatsApp está correto acima{finished.emailSent ? ' e olhe sua caixa de spam no e-mail' : ''}. Se ainda assim não chegar, fale com a gente pelo WhatsApp da equipe abaixo.
                </p>
              </div>
            </div>

            <div className="px-4 sm:px-8 pb-8">
              <button
                onClick={openTeamWhatsApp}
                className="flex items-center justify-center gap-2 w-full p-3 rounded-xl border border-borderColor text-textMuted font-bold text-sm"
              >
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.29-1.39a9.9 9.9 0 0 0 4.75 1.21h.01c5.46 0 9.9-4.45 9.9-9.91S17.5 2 12.04 2Z" /></svg>
                Falar com a equipe no WhatsApp (opcional)
              </button>
            </div>
          </div>
        </div>
      );
    }

    const currentData = visibleSteps[currentStep];

    return (
      <div className="flex w-full bg-bgBody justify-center items-center font-sans p-2 rounded-xl">
        <div className="flex flex-col w-full max-w-2xl bg-bgBody shadow-lg rounded-xl sm:border sm:border-borderColor overflow-hidden">
          
          <div className="px-6 pt-8 pb-4">
            <div className="h-1.5 w-full bg-surface rounded-full overflow-hidden mb-6 relative">
              <div 
                className="h-full bg-brand transition-all duration-300 ease-in-out" 
                style={{ width: `${((currentStep + 1) / visibleSteps.length) * 100}%` }} 
              />
            </div>
            <span className="text-xs font-bold text-textMuted uppercase tracking-widest">
              Passo {currentStep + 1}/{visibleSteps.length}
            </span>
          </div>

          <div className="px-6 pb-6 flex-grow overflow-y-auto max-h-[60vh]">
            <h2 className="text-3xl font-black text-textMain mb-2 leading-tight">{currentData.title}</h2>
            <p className="text-textMuted mb-8">{currentData.subtitle}</p>

            {currentData.type === 'form' ? (
              <div className="flex flex-col gap-4">
                {currentData.fields.map((field) => {
                  if (field.id !== 'whatsapp_phone') {
                    return (
                      <input
                        key={field.id}
                        type={field.type}
                        value={answers[field.id] || ''}
                        onChange={(e) => setAnswers({...answers, [field.id]: e.target.value})}
                        placeholder={field.placeholder}
                        className="w-full bg-surface text-textMain p-5 rounded-2xl text-xl border border-borderColor transition-all min-h-[60px]"
                      />
                    );
                  }
                  const selectedCountry = ALL_COUNTRIES.find((c) => c.iso === whatsappCountry) || ALL_COUNTRIES[0];
                  const filteredCountries = countrySearch.trim()
                    ? ALL_COUNTRIES.filter((c) => c.name.toLowerCase().includes(countrySearch.trim().toLowerCase()) || c.dial.includes(countrySearch.trim()))
                    : ALL_COUNTRIES;
                  const validation = getPhoneValidation(answers.whatsapp_phone, whatsappCountry);
                  return (
                    <div key={field.id} className="relative">
                      <div className="flex gap-2">
                        <button
                          type="button"
                          onClick={() => setCountryPickerOpen((v) => !v)}
                          className="flex items-center gap-1.5 bg-surface text-textMain px-3.5 rounded-2xl text-lg border border-borderColor min-h-[60px] whitespace-nowrap"
                        >
                          <span>{selectedCountry ? selectedCountry.flag : ''}</span>
                          <span className="font-bold">{selectedCountry ? selectedCountry.dial : ''}</span>
                          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m6 9 6 6 6-6"/></svg>
                        </button>
                        <input
                          type="tel"
                          value={answers.whatsapp_phone || ''}
                          onChange={(e) => {
                            const raw = e.target.value;
                            // Colou um número já com "+DDI" -- detecta o país
                            // e atualiza o seletor em vez de validar contra o
                            // país que já estava selecionado.
                            if (raw.trim().startsWith('+') && window.libphonenumber) {
                              const parsed = window.libphonenumber.parsePhoneNumberFromString(raw.trim());
                              if (parsed && parsed.country && parsed.country !== whatsappCountry) {
                                setWhatsappCountry(parsed.country);
                              }
                            }
                            setAnswers({...answers, whatsapp_phone: raw});
                          }}
                          placeholder="Ex: 11 91234-5678"
                          className="flex-1 min-w-0 bg-surface text-textMain p-5 rounded-2xl text-xl border border-borderColor transition-all min-h-[60px]"
                        />
                      </div>

                      {countryPickerOpen && (
                        <div className="absolute z-10 top-[64px] left-0 w-full max-h-72 overflow-y-auto bg-bgBody border border-borderColor rounded-2xl shadow-lg p-2">
                          <input
                            type="text"
                            value={countrySearch}
                            onChange={(e) => setCountrySearch(e.target.value)}
                            placeholder="Buscar país..."
                            className="w-full bg-surface text-textMain p-3 rounded-xl text-base border border-borderColor mb-2"
                            autoFocus
                          />
                          {filteredCountries.map((c) => (
                            <button
                              type="button"
                              key={c.iso}
                              onClick={() => { setWhatsappCountry(c.iso); setCountryPickerOpen(false); setCountrySearch(''); }}
                              className="flex items-center gap-2 w-full text-left px-3 py-2.5 rounded-lg hover:bg-surface text-base"
                            >
                              <span>{c.flag}</span>
                              <span className="flex-1 text-textMain">{c.name}</span>
                              <span className="text-textMuted font-bold">{c.dial}</span>
                            </button>
                          ))}
                        </div>
                      )}

                      {validation.error ? (
                        <p className="text-red-600 text-sm mt-2 font-semibold">{validation.error}</p>
                      ) : validation.preview ? (
                        <p className="text-textMuted text-sm mt-2">Vai ficar assim: <strong className="text-textMain">{validation.preview}</strong></p>
                      ) : null}
                    </div>
                  );
                })}
              </div>
            ) : currentData.type === 'number' || currentData.type === 'text' ? (
              <input 
                type={currentData.type === 'number' ? "number" : "text"}
                value={answers[currentData.dbField] || ''} 
                onChange={(e) => setAnswers({...answers, [currentData.dbField]: e.target.value})} 
                placeholder={currentData.placeholder} 
                className="w-full bg-surface text-textMain p-5 rounded-2xl text-xl border border-borderColor transition-all min-h-[60px]" 
              />
            ) : currentData.type === 'slider' ? (
              <div className="bg-surface p-8 rounded-3xl border border-borderColor flex flex-col items-center shadow-sm">
                <div className="text-brand text-6xl font-black mb-4">
                  {answers[currentData.dbField] || currentData.recommended}
                  <span className="text-2xl text-textMuted font-bold"> {currentData.unit}</span>
                </div>
                <input
                  type="range"
                  min={currentData.min}
                  max={currentData.max}
                  step={currentData.step}
                  value={answers[currentData.dbField] || currentData.recommended}
                  onChange={(e) => setAnswers({...answers, [currentData.dbField]: Number(e.target.value)})}
                  className="w-full h-2 bg-gray-300 rounded-lg appearance-none cursor-pointer accent-brand"
                />
              </div>
            ) : (
              <div className="flex flex-col gap-3">
                {(() => {
                  const noneOption = currentData.type === 'multiple' ? findNoneOption(currentData.options) : null;
                  const noneSelected = noneOption && (answers[currentData.dbField] || []).includes(noneOption.id);
                  const blockedByPreferenceIds = currentData.dbField === 'dietary_restrictions_ids'
                    ? getBlockedRestrictionIds(answers.dietary_preference_id)
                    : [];
                  return currentData.options?.map((opt, i) => {
                  const isSelected = currentData.type === 'multiple'
                    ? (answers[currentData.dbField] || []).includes(opt.id)
                    : answers[currentData.dbField] === opt.id;
                  const isDisabled = (noneSelected && opt.id !== noneOption.id) || blockedByPreferenceIds.includes(opt.id);
                  return (
                    <button
                      key={i}
                      onClick={() => !isDisabled && handleSelect(opt.id)}
                      disabled={isDisabled}
                      className={`p-5 rounded-2xl flex justify-between items-center border transition-all duration-300 w-full text-left
                        ${isDisabled ? 'opacity-40 cursor-not-allowed' : 'cursor-pointer'}
                        ${isSelected ? 'border-brand bg-brand/10 shadow-sm' : 'border-borderColor bg-surface hover:bg-gray-50'}`}
                    >
                      <span className={`text-lg font-medium transition-colors ${isSelected ? 'text-brand' : 'text-textMain'}`}>
                        {opt.name_ptbr || opt.name}
                      </span>
                      
                      <div className={`w-6 h-6 flex justify-center items-center flex-shrink-0 transition-all duration-300
                        ${currentData.type === 'multiple' ? 'rounded-md' : 'rounded-full'} 
                        ${isSelected ? 'bg-brand border-brand shadow-[0_0_8px_rgba(245,95,22,0.4)]' : 'border-2 border-gray-300 bg-surface'}`}>
                        
                        <svg 
                          className={`w-3.5 h-3.5 text-white transition-transform duration-300 ease-out ${isSelected ? 'scale-100 opacity-100' : 'scale-50 opacity-0'}`} 
                          fill="none" 
                          viewBox="0 0 24 24" 
                          stroke="currentColor" 
                          strokeWidth="3"
                        >
                          <path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" />
                        </svg>

                      </div>
                    </button>
                  );
                  });
                })()}
              </div>
            )}
          </div>

          <div className="p-6 flex gap-4 border-t border-borderColor bg-bgBody">
            <button 
              onClick={() => setCurrentStep(Math.max(0, currentStep - 1))}
              disabled={currentStep === 0}
              className={`flex-1 p-4 rounded-xl items-center justify-center font-bold transition-opacity ${currentStep === 0 ? 'opacity-50 cursor-not-allowed bg-gray-200 text-gray-500' : 'bg-surface hover:bg-gray-100 text-textMuted'}`}
            >
              VOLTAR
            </button>
            <button 
              onClick={nextStep} 
              disabled={isNextDisabled() || loading}
              className={`flex-[2] p-4 rounded-xl flex items-center justify-center transition-all ${isNextDisabled() ? 'bg-gray-300 cursor-not-allowed text-gray-500' : 'bg-brand hover:bg-brand/90 text-white shadow-md'}`}
            >
              <span className="font-black text-lg">
                {currentStep === visibleSteps.length - 1 ? 'FINALIZAR' : 'PRÓXIMO'}
              </span>
            </button>
          </div>

        </div>
      </div>
    );
  }

  const root = ReactDOM.createRoot(document.getElementById('onboarding-root'));
  root.render(<OnboardingApp />);
</script>
