  /* Reset global absoluto dentro do nosso container */
  #onboarding-root * {
    -webkit-tap-highlight-color: transparent !important;
  }
  
  #onboarding-root button,
  #onboarding-root input,
  #onboarding-root button:focus,
  #onboarding-root button:active,
  #onboarding-root button:focus-visible,
  #onboarding-root input:focus {
    outline: 0 !important;
    outline-offset: 0 !important;
    box-shadow: none !important;
    --tw-ring-shadow: 0 0 #0000 !important;
    --tw-ring-color: transparent !important;
  }

  /* Remove bordas nativas internas do Firefox que geram contornos */
  #onboarding-root button::-moz-focus-inner {
    border: 0 !important;
  }

  /* Força a nossa cor em inputs focados */
  #onboarding-root input:focus {
    border-color: #F55F16 !important;
  }
</style>

<!-- 5. App Completo (Babel compila no navegador) -->
<script type="text/babel">
  const { useState, useEffect, useMemo } = React;

  const SUPABASE_URL = 'https://jwjfmvkfzelbdvyqetyb.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_NPp7sXlnySRgcATvV2K2fA_FD-kgfsx';           
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const SUBSCRIPTION_PLANS = {
    TRAINING: '3a5ccc00-77ed-4b87-8e83-bc35be63a862',
    MEAL: '7458939c-ed4b-4a16-960e-b647f94e6a9b',
    COMPLETE: '7b5502f1-eeed-4640-8c4f-0ebc0502481e',
  };

  const WHATSAPP_NUMBER = '5511955026812';

  // Restrições que ficam redundantes/implícitas dado o dietary_preference_id
  // (slug da tabela dietary_preferences) escolhido -- evita marcar "Sem Carne
  // Vermelha" sendo vegetariano, por ex. Chave = slug; valores = name_ptbr
  // (lowercase) das opções de dietary_restrictions a bloquear. Não existe
  // opção "Sem Frango" no catálogo hoje, então pescetariano não bloqueia nada
  // relacionado a frango -- se essa opção for criada, só adicionar aqui.
  const DIETARY_RESTRICTION_BLOCKS_BY_PREFERENCE = {
    vegan: ['sem carne suína', 'sem carne vermelha', 'sem frutos do mar', 'sem peixe', 'sem ovos', 'sem laticínios'],
    vegetarian: ['sem carne suína', 'sem carne vermelha', 'sem frutos do mar', 'sem peixe'],
    pescetarian: ['sem carne suína', 'sem carne vermelha'],
    no_seafood: ['sem frutos do mar'],
    no_red_meat: ['sem carne vermelha'],
    no_pork: ['sem carne suína'],
    omnivore: [],
    flexitarian: [],
  };

  // Mascara o WhatsApp exibido na tela de confirmação -- mantém os 4
  // primeiros e os 2 últimos caracteres visíveis, independente do formato
  // que a pessoa digitou (sem validação/normalização ainda, ver item 7).
  const maskPhone = (phone) => {
    const clean = String(phone || '').trim();
    if (clean.length < 7) return clean;
    return `${clean.slice(0, 4)}${'•'.repeat(clean.length - 6)}${clean.slice(-2)}`;
  };

  function OnboardingApp() {
    const [currentStep, setCurrentStep] = useState(0);
    const [loading, setLoading] = useState(true);
    // Preenchido só depois que o profile foi salvo com SUCESSO -- erro no
    // upsert/update cai no catch (alert), nunca seta isso. Uma vez setado,
    // troca a tela inteira pela confirmação; não existe caminho de volta
    // pro formulário nesta sessão (sem botão VOLTAR, sem reenvio).
    const [finished, setFinished] = useState(null);

    const [answers, setAnswers] = useState({
      subscription_type_id: SUBSCRIPTION_PLANS.COMPLETE,
      // Slider é opcional (isNextDisabled ignora), mas a tela já mostra "45 min"
      // por default (currentData.recommended) -- sem seedar aqui, quem nunca
      // arrasta o handle avança com answers.training_duration_minutes undefined,
      // o update() não manda a chave, e a coluna fica no default do schema (30),
      // divergindo do que a pessoa viu na tela. Bug real, achado 2026-08-22.
      training_duration_minutes: 45,
      // Mesmo bug do slider acima, achado 2026-09-17: quem não arrasta o
      // handle de "dias por semana" avança com dedicated_days_per_week
      // undefined -- training_days_per_week/nutrition_days_per_week ficam no
      // default do schema em vez do "4 dias" (recommended) que a tela mostra.
      dedicated_days_per_week: 4
    });

    const userName = answers.first_name || 'Futuro Aluno'; 

    const checkCondition = (currentAnswers, stepsData, field, matchTerm) => {
      const step = stepsData.find(s => s.dbField === field);
      if (!step || !step.options) return false;
      
      const target = step.options.find(o => 
        String(o.name_ptbr || o.name || '').toLowerCase().includes(matchTerm.toLowerCase()) ||
        String(o.id).toLowerCase() === matchTerm.toLowerCase()
      );
      if (!target) return false;

      const selection = currentAnswers[field];
      if (!selection) return false;

      return Array.isArray(selection) ? selection.includes(target.id) : selection === target.id;
    };

    const [steps, setSteps] = useState([
      // ==========================================================
      // CADASTRO INICIAL
      // ==========================================================
      { 
        id: 'registration', 
        title: "Vamos começar!", 
        subtitle: "Preencha seus dados para criarmos o seu perfil", 
        type: 'form', 
        fields: [
          { id: 'first_name', placeholder: 'Nome', type: 'text' },
          { id: 'last_name', placeholder: 'Sobrenome', type: 'text' },
          { id: 'email', placeholder: 'E-mail', type: 'email' },
          { id: 'whatsapp_phone', placeholder: 'WhatsApp (Ex: +351...)', type: 'tel' }
        ],
        condition: () => true
      },
      { 
        id: 'goals', 
        title: "Qual é o seu principal objetivo?", 
        subtitle: "Múltipla escolha", 
        type: 'multiple', 
        dbField: 'goals_ids', 
        table: 'goals',
        condition: (ans) => true
      },
      { 
        id: 'gender', 
        title: "Qual o seu género?", 
        subtitle: "Escolha única", 
        type: 'single', 
        dbField: 'gender_id', 
        table: 'genders',
        condition: (ans) => true
      },
      { 
        id: 'age', 
        title: "Qual a sua idade?", 
        subtitle: "Digite a sua idade", 
        type: 'number', 
        dbField: 'age', placeholder: "Ex: 38",
        condition: (ans) => true
      },
      { 
        id: 'weight', 
        title: "Qual o seu peso atual?", 
        subtitle: "Peso em kg", type: 'number', 
        dbField: 'weight_kg', placeholder: "Ex: 70",
        condition: (ans) => true
      },
      { 
        id: 'height', 
        title: "Qual a sua altura?", 
        subtitle: "Altura em cm", 
        type: 'number', 
        dbField: 'height_cm', 
        placeholder: "Ex: 155",
        condition: (ans) => true
      },
      { 
        id: 'activity_level', 
        title: "Considera-se uma pessoa ativa?", 
        subtitle: "Escolha única", type: 'single', 
        dbField: 'activity_level_id', table: 'activity_levels',
        condition: (ans) => true
      },
      { 
        id: 'health_conditions', 
        title: "Possui alguma condição de saúde?", 
        subtitle: "Múltipla escolha", 
        type: 'multiple', 
        dbField: 'health_conditions_ids', 
        table: 'health_conditions',
        condition: (ans) => true
      },
      { 
        id: 'pregnancy_trimester', 
        title: "Em qual trimestre da gestação está?", 
        subtitle: "Escolha única", 
        type: 'single', 
        dbField: 'pregnancy_trimester', 
        options: [{ id: 1, name_ptbr: '1º trimestre' }, { id: 2, name_ptbr: '2º trimestre' }, { id: 3, name_ptbr: '3º trimestre' }],
        condition: (ans, stp) => checkCondition(ans, stp, 'health_conditions_ids', 'Gravidez')
      },
      // ==========================================================
      // ETAPAS UNIFICADAS & TREINO
      // ==========================================================
      {
        id: 'physical_conditions',
        title: "Possui alguma dor ou limitação física?",
        subtitle: "Múltipla escolha",
        type: 'multiple',
        dbField: 'physical_conditions_ids',
        table: 'onboarding_physical_conditions',
        condition: (ans) => true
      },
      {
        id: 'dedicated_days_per_week',
        title: "Quantos dias por semana pretende se dedicar ao plano?",
        // Faixa 3-5 confirmada com personal trainer (2026-09-06): menos de 3
        // dias não dá estímulo suficiente pra resultado, mais de 5 não deixa
        // o músculo recuperar entre as sessões -- por isso o limite, não
        // falha de formulário.
        subtitle: "Menos de 3 dias não dá estímulo suficiente pra resultado; mais de 5 não deixa o músculo recuperar entre os treinos.",
        type: 'slider',
        dbField: 'dedicated_days_per_week', min: 3, max: 5, step: 1, recommended: 4, unit: 'dias',
        condition: (ans) => true
      },
      { 
        id: 'muscle_groups', 
        title: "Qual parte do corpo gostaria de focar?", 
        subtitle: "Múltipla escolha", type: 'multiple', 
        dbField: 'muscle_groups_ids', 
        table: 'onboarding_muscle_groups',
        condition: (ans) => true
      },
      { 
        id: 'exercise_environment', 
        title: "Onde pretende treinar?", 
        subtitle: "Escolha única", 
        type: 'single', 
        dbField: 'exercise_environment_id', 
        table: 'exercise_environment',
        condition: (ans) => true
      },
      { 
        id: 'exercise_equipments', 
        title: "Que equipamentos possui?", 
        subtitle: "Múltipla escolha", 
        type: 'multiple', 
        dbField: 'exercise_equipment_ids', 
        table: 'onboarding_exercise_equipments', 
        condition: (answers, stepsData) => {
          const environmentAnswer = answers.exercise_environment_id;
          if (!environmentAnswer) return false;

          const environmentStep = stepsData.find(step => step.dbField === 'exercise_environment_id');
          const chosenOption = environmentStep?.options?.find(opt => opt.id === environmentAnswer);

          const selectedHomeWithEquipment = 
            environmentAnswer === 'home_with_equipment' || 
            (chosenOption && Object.values(chosenOption).some(value => String(value).includes('home_with_equipment')));

          return selectedHomeWithEquipment;
        }
      },
      { 
        id: 'training_duration_minutes', 
        title: "Quanto tempo tem por treino?", 
        subtitle: "Deslize para definir o tempo", 
        type: 'slider',
        dbField: 'training_duration_minutes', min: 15, max: 90, step: 15, recommended: 45, unit: 'min',
        condition: (ans) => true
      },
      { 
        id: 'exercise_level', 
        title: "Qual a sua experiência com treinos?", 
        subtitle: "Escolha única", 
        type: 'single', 
        dbField: 'exercise_level_id', 
        table: 'exercise_levels',
        condition: (ans) => true
      },
      // ==========================================================
      // ETAPAS DE NUTRIÇÃO
      // ==========================================================
      {
        id: 'meals_per_day',
        title: "Como é sua rotina alimentar?",
        subtitle: "É só pra entender seus hábitos — o nutricionista vai indicar o ideal para você",
        type: 'single',
        dbField: 'meals_per_day',
        // Refeição principal e lanche são categorias diferentes na
        // nutrição: as 3 principais (café/almoço/jantar) são a base fixa,
        // o que varia é o nº de lanches. Bate com o que o gerador já faz
        // (3=sem lanche, 4=1 lanche, 5=2, 6=3). Correção 3 (2026-08-10).
        options: [
          {id: 3, name_ptbr: '3 refeições principais — café da manhã, almoço e jantar'},
          {id: 4, name_ptbr: '3 refeições + 1 lanche'},
          {id: 5, name_ptbr: '3 refeições + 2 lanches'},
          {id: 6, name_ptbr: '3 refeições + 3 lanches — comendo a cada 3 horas'}
        ],
        condition: (ans) => true
      },
      { 
        id: 'dietary_preferences', 
        title: "Qual opção define melhor sua alimentação?", 
        subtitle: "Escolha única", 
        type: 'single', 
        dbField: 'dietary_preference_id', 
        table: 'dietary_preferences', 
        condition: (ans) => true
      },
      { 
        id: 'dietary_restrictions', 
        title: "Possui alguma restrição ou intolerância alimentar?", 
        subtitle: "Múltipla escolha", 
        type: 'multiple', 
        dbField: 'dietary_restrictions_ids', 
        table: 'dietary_restrictions', 
        condition: (ans) => true
      },
      { 
        id: 'disliked_foods', 
        title: "Existe algum alimento que prefere evitar?", 
        subtitle: "Deixe em branco se comer de tudo", 
        type: 'text', 
        dbField: 'disliked_foods', 
        placeholder: "Ex: fígado, cebola, brócolis…",
        condition: (ans) => true
      }
    ]);

    useEffect(() => {
      async function fetchAllOptions() {
        try {
          const updatedSteps = await Promise.all(steps.map(async (step) => {
            if (step.table) {
              const { data, error } = await supabase.from(step.table).select('*').order('sort_order');
              if (error || !data) return step;
              let mapped = data.map(item => ({
                ...item,
                id: item.id || item[Object.keys(item).find(k => k.includes('id'))],
                name_ptbr: item.name_ptbr || item.label_ptbr || item.name || item.title,
                name: item.name_ptbr || item.label_ptbr || item.name || item.title
              }));
              // PASSO 17 (dietary_restrictions): carne suína/vermelha, peixe e
              // frutos do mar já são cobertos pela pergunta de preferência
              // alimentar (vegano/vegetariano/pescetariano etc via
              // DIETARY_RESTRICTION_BLOCKS_BY_PREFERENCE) -- oferecer de novo
              // aqui é redundante e confunde quem já respondeu. Removido
              // 2026-08-22 a pedido da Taina.
              if (step.dbField === 'dietary_restrictions_ids') {
                const REDUNDANT_WITH_PREFERENCE = ['sem carne suína', 'sem carne vermelha', 'sem frutos do mar', 'sem peixe'];
                mapped = mapped.filter(o => !REDUNDANT_WITH_PREFERENCE.includes(String(o.name_ptbr || '').trim().toLowerCase()));
              }
              return { ...step, options: mapped };
            }
            return step;
          }));
          setSteps(updatedSteps);
        } catch (e) { 
          console.error("Erro na busca das opções:", e); 
        } finally { 
          setLoading(false); 
        }
      }
      fetchAllOptions();
    }, []);

    const visibleSteps = useMemo(() => steps.filter(step => step.condition ? step.condition(answers, steps) : true), [answers, steps]);

    // "Nenhuma"/"Nenhum" é detectado pelo nome vindo do banco, não por uma
    // lista fixa de tabelas -- assim a exclusão mútua vale pra qualquer
    // pergunta múltipla que tenha essa opção, inclusive se o catálogo mudar.
    const findNoneOption = (options) => (options || []).find(o => {
      const label = String(o.name_ptbr || o.name || '').trim().toLowerCase();
      return label === 'nenhuma' || label === 'nenhum';
    });

    // IDs de dietary_restrictions que ficam bloqueados dada a preferência
    // alimentar escolhida (answers.dietary_preference_id guarda o uuid da
    // opção, não o slug -- o slug mora em opt.dietary_preference_id,
    // preservado pelo spread do fetchAllOptions).
    const getBlockedRestrictionIds = (preferenceOptionId) => {
      if (!preferenceOptionId) return [];
      const prefOptions = steps.find(s => s.dbField === 'dietary_preference_id')?.options || [];
      const chosenPref = prefOptions.find(o => o.id === preferenceOptionId);
      const blockedLabels = DIETARY_RESTRICTION_BLOCKS_BY_PREFERENCE[chosenPref?.dietary_preference_id] || [];
      const restrictionOptions = steps.find(s => s.dbField === 'dietary_restrictions_ids')?.options || [];
      return restrictionOptions
        .filter(o => blockedLabels.includes(String(o.name_ptbr || o.name || '').trim().toLowerCase()))
        .map(o => o.id);
    };

    const handleSelect = (optionId) => {
      const stepData = visibleSteps[currentStep];
      const field = stepData.dbField;
      if (stepData.type === 'multiple') {
        const noneOption = findNoneOption(stepData.options);
        const selections = answers[field] || [];

        let newSelections;
        if (noneOption && optionId === noneOption.id) {
          // Selecionar "Nenhuma" desmarca e desabilita as outras.
          newSelections = selections.includes(optionId) ? [] : [optionId];
        } else {
          // Selecionar qualquer outra desmarca "Nenhuma".
          const withoutNone = noneOption ? selections.filter(i => i !== noneOption.id) : selections;
          newSelections = withoutNone.includes(optionId) ? withoutNone.filter(i => i !== optionId) : [...withoutNone, optionId];
        }
        setAnswers({ ...answers, [field]: newSelections });
      } else if (field === 'dietary_preference_id') {
        // Trocar a preferência limpa restrições que já ficaram implícitas/
        // redundantes -- senão fica um estado inválido salvo (ex: vegano com
        // "Sem Ovos" marcado à parte).
        const blockedIds = getBlockedRestrictionIds(optionId);
        const currentRestrictions = answers.dietary_restrictions_ids || [];
        setAnswers({
          ...answers,
          [field]: optionId,
          dietary_restrictions_ids: currentRestrictions.filter(id => !blockedIds.includes(id)),
        });
      } else {
        setAnswers({ ...answers, [field]: optionId });
      }
    };

    const isNextDisabled = () => {
      const stepData = visibleSteps[currentStep];
      const value = answers[stepData.dbField];
      if (stepData.type === 'form') {
        return !answers.first_name || !answers.last_name || !answers.email || !answers.whatsapp_phone;
      }
      // 'single' e 'multiple' cobrem todas as perguntas de catálogo (gênero,
      // condições físicas, objetivos, etc.) -- sem isso o usuário avançava
      // sem responder e o perfil ficava com campo nulo/"incompleto" no
      // dashboard, sem nenhum aviso. Perguntas com opção "Nenhuma" exigem
      // escolher explicitamente "Nenhuma", não deixar em branco.
      if (stepData.type === 'single') {
        return value === undefined || value === null || value === '';
      }
      if (stepData.type === 'multiple') {
        return !Array.isArray(value) || value.length === 0;
      }
      if (stepData.type === 'number') {
        return value === undefined || value === null || value === '' || isNaN(Number(value));
      }
      // 'text' (disliked_foods) e 'slider' (training_duration_minutes) ficam
      // opcionais de propósito -- texto livre tem subtítulo dizendo "deixe em
      // branco", e o slider sempre carrega um valor default (recommended).
      return false;
    };

    // Não é mais chamado automaticamente no fim do formulário (ver item 3a:
    // essa mensagem nunca foi lida por nenhum código nosso -- o webhook só
    // processa callback de entrega dos templates que A GENTE manda, nunca
    // reage a mensagem recebida). Fica como botão OPCIONAL na tela de
    // confirmação, pra quem quiser abrir uma conversa com a equipe.
    const openTeamWhatsApp = () => {
      const message = encodeURIComponent(`Olá! Sou o ${userName} e acabei de finalizar meu perfil na plataforma.`);
      window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${message}`, '_blank', 'noopener');
    };

    const nextStep = async () => {
      if (isNextDisabled()) return;

      if (currentStep < visibleSteps.length - 1) {
        setCurrentStep(currentStep + 1);
      } else {
        setLoading(true);
        try {
          const email = answers.email?.trim();
          const firstName = answers.first_name?.trim();
          const lastName = answers.last_name?.trim();
          const whatsappPhone = answers.whatsapp_phone?.trim();

          // 1. Criar conta — senha gerada, invisível, nunca guardada por nós.
          // Se o usuário precisar voltar depois, o caminho é reset de senha por
          // e-mail (ele nunca soube esta senha pra "lembrar" dela).
          const generatedPassword = crypto.randomUUID();

          const { data: signUpData, error: signUpError } = await supabase.auth.signUp({
            email,
            password: generatedPassword,
            options: {
              data: {
                full_name: `${firstName} ${lastName}`.trim(),
                first_name: firstName,
                last_name: lastName,
              }
            }
          });

          if (signUpError) {
            if (signUpError.message?.toLowerCase().includes('already registered')) {
              alert('Este e-mail já tem um perfil por aqui. Verifique seu WhatsApp ou fale com a gente.');
              return;
            }
            throw new Error('Erro ao criar conta: ' + signUpError.message);
          }

          // Supabase pode "suceder" com identities vazio quando o e-mail já
          // existe (proteção anti-enumeração) — mesmo caso do erro acima.
          if (signUpData?.user?.identities && signUpData.user.identities.length === 0) {
            alert('Este e-mail já tem um perfil por aqui. Verifique seu WhatsApp ou fale com a gente.');
            return;
          }

          if (!signUpData?.session) {
            alert('Conta criada! Confirme seu e-mail para continuar.');
            return;
          }

          const userId = signUpData.user.id;

          // 2. A linha de profile não nasce sozinha — upsert inicial primeiro.
          const { error: upsertError } = await supabase.from('profiles').upsert({
            id: userId,
            full_name: `${firstName} ${lastName}`.trim(),
            first_name: firstName,
            last_name: lastName,
            whatsapp_phone: whatsappPhone,
          });
          if (upsertError) throw new Error('Erro ao criar perfil: ' + upsertError.message);

          // 3. Atualiza com os campos do onboarding — remapeamentos:
          // exercise_equipment_ids (form) -> exercise_equipments_ids (coluna),
          // dedicated_days_per_week (form) -> alimenta os dois generators.
          // subscription_type_id NÃO é mais enviado por aqui -- vira DEFAULT
          // da coluna no banco (piloto só oferece COMPLETE, ver migration de
          // 2026-09-17); isTraining/isMeal abaixo continuam calculados
          // localmente com answers.subscription_type_id (que segue sendo
          // COMPLETE, nunca muda nesta tela).
          //
          // pregnancy_trimester e exercise_equipments_ids só são gravados se
          // a etapa que os preenche está VISÍVEL no momento do FINALIZAR --
          // um resquício de resposta de uma condição que a pessoa desmarcou
          // depois (ex: marcou "Gravidez", escolheu o trimestre, desmarcou
          // "Gravidez" de novo) não deve sobreviver no perfil salvo.
          const isPregnancyVisible = steps.find(s => s.id === 'pregnancy_trimester')?.condition(answers, steps) ?? false;
          const isEquipmentsVisible = steps.find(s => s.id === 'exercise_equipments')?.condition(answers, steps) ?? false;

          const { error: profileError } = await supabase.from('profiles').update({
            goals_ids: answers.goals_ids || [],
            gender_id: answers.gender_id,
            age: answers.age,
            weight_kg: answers.weight_kg,
            height_cm: answers.height_cm,
            activity_level_id: answers.activity_level_id,
            health_conditions_ids: answers.health_conditions_ids || [],
            pregnancy_trimester: isPregnancyVisible ? answers.pregnancy_trimester : null,
            physical_conditions_ids: answers.physical_conditions_ids || [],
            muscle_groups_ids: answers.muscle_groups_ids || [],
            exercise_environment_id: answers.exercise_environment_id,
            exercise_equipments_ids: isEquipmentsVisible ? (answers.exercise_equipment_ids || []) : [],
            training_duration_minutes: answers.training_duration_minutes,
            exercise_level_id: answers.exercise_level_id,
            training_days_per_week: answers.dedicated_days_per_week,
            nutrition_days_per_week: answers.dedicated_days_per_week,
            meals_per_day: answers.meals_per_day,
            dietary_preference_id: answers.dietary_preference_id,
            dietary_restrictions_ids: answers.dietary_restrictions_ids || [],
            disliked_foods: answers.disliked_foods,
            onboarding_completed: true,
          }).eq('id', userId);

          if (profileError) throw new Error('Erro ao salvar perfil: ' + profileError.message);

          // withTimeout definido aqui em cima pra poder envolver o envio de
          // e-mail já nesta etapa (ver 3c abaixo), reaproveitado de novo
          // mais adiante pra notify-plan-ready/create-plan-share-token.
          const withTimeout = (promise, ms) => Promise.race([
            promise,
            new Promise((resolve) => setTimeout(() => resolve({ timedOut: true }), ms)),
          ]);

          // 3b. Avisa usuário ("recebemos seu perfil, estamos montando") e
          // sales ("novo aluno completou onboarding") — fire-and-forget,
          // ANTES dos geradores pra não deixar o usuário no vácuo enquanto a
          // IA roda. Sem await de propósito: os geradores (com IA) já são
          // lentos, não vale atrasar o loading por uma garantia de ordem que
          // o gap humano de validação do plano (horas) já dá de qualquer jeito.
          supabase.functions.invoke('ybytu-notify-onboarding-received').catch((e) => console.error(e));

          // 3c. Email de confirmação + recapitulativo (Resend) — AGORA
          // aguardado com timeout (não mais fire-and-forget), pra saber na
          // hora de montar a tela de confirmação se o e-mail realmente foi
          // enviado. Achado 2026-09-17: SPF de send.ybytu.app confere, mas
          // não achei DKIM verificado nem o id da mensagem do Resend em
          // lugar nenhum (a function não loga isso) -- não dá pra prometer
          // "também enviamos e-mail" sem confirmar de verdade a resposta
          // desta chamada. emailSent alimenta a tela de confirmação abaixo.
          let emailSent = false;
          try {
            const emailResult = await withTimeout(supabase.functions.invoke('ybytu-send-onboarding-email'), 5000);
            emailSent = !emailResult?.timedOut && !emailResult?.error;
            if (emailResult?.error) console.error('ybytu-send-onboarding-email retornou erro:', emailResult.error);
            else if (emailResult?.timedOut) console.error('ybytu-send-onboarding-email não respondeu em 5s (timeout)');
          } catch (e) {
            console.error('ybytu-send-onboarding-email falhou:', e);
          }

          // 4. Dispara os geradores novos — fail-soft: erro não trava o
          // redirect (não perde o lead), só marca a flag pra suporte ver depois.
          const isTraining = [SUBSCRIPTION_PLANS.TRAINING, SUBSCRIPTION_PLANS.COMPLETE].includes(answers.subscription_type_id);
          const isMeal = [SUBSCRIPTION_PLANS.MEAL, SUBSCRIPTION_PLANS.COMPLETE].includes(answers.subscription_type_id);

          // plan_generation_status agora é escrito pela PRÓPRIA edge function
          // (ybytu-generate-training-plan / ybytu-generate-meal-plan) no fim da
          // execução real, não mais inferido daqui de o fetch ter resolvido
          // antes de um timeout do client — Gemini pode levar 3+min e o client
          // desistir enquanto o gerador termina certinho no servidor (ver
          // memória project_plan_generation_status_false_positive). Erro de
          // uma chamada não trava o redirect (fail-soft), só loga.
          //
          // SEQUENCIAL, não Promise.all (2026-08-31, achado investigando o
          // rate limit de TPM do Groq): as duas functions competem pelo MESMO
          // orçamento de tokens/min da organização. Nutrição primeiro (1
          // chamada, rápida) porque o treino é quem tem múltiplas chamadas
          // (1 por dia) e mais chance de colidir — deixar o treino disparar
          // só depois da nutrição já ter liberado o teto elimina a maior
          // fonte de disputa simultânea (a chamada de nutrição sozinha
          // reservava >50% do teto de uma vez). Não elimina 100% (planos de
          // treino de 5+ dias ainda podem colidir entre si), mas reduz
          // bastante — ver docs/TESTE_GERADOR_TREINO_SPLIT_POR_DIA_20260831.md.
          if (isMeal) await supabase.functions.invoke('ybytu-generate-meal-plan').catch((e) => console.error(e));
          if (isTraining) await supabase.functions.invoke('ybytu-generate-training-plan').catch((e) => console.error(e));

          // 4b. Avisa personal/nutri que tem plano novo pra validar —
          // fail-soft igual ao resto: se falhar, o cron de lembrete (12h)
          // cobre o caso mesmo assim, não trava o redirect do usuário.
          // 4c. Gera o link compartilhável (/plano/<token>) na hora, em vez
          // de alguém ter que criar a linha em plan_share_tokens na mão pra
          // conseguir revisar/testar o plano depois — mesmo fail-soft.
          // Sempre dispara os dois: ambas as functions já checam
          // plan_generation_status='ok' no servidor antes de fazer qualquer
          // coisa, então um erro/timeout do LADO DO CLIENTE aqui (Gemini
          // pode levar 3+min) não deve impedir o disparo -- geração pode ter
          // terminado certinha no servidor mesmo com o client tendo dado erro
          // (ver memória project_plan_generation_status_false_positive). Gate
          // client-side aqui já causou 0 notificações pro staff em 2
          // onboardings reais (2026-08-26 e 2026-08-27) apesar do plano ter
          // sido gerado com sucesso.
          //
          // AWAIT com timeout de 5s antes do redirect (achado 2026-09-17):
          // window.location.href logo em seguida podia cancelar essas 2
          // chamadas fire-and-forget no meio do voo -- o navegador não
          // garante que um fetch em andamento termina quando a página troca
          // de URL. Promise.allSettled (não Promise.all) pra um erro em uma
          // não esperar/derrubar a outra; timeout de 5s pra não segurar o
          // redirect indefinidamente se alguma travar. withTimeout definido
          // mais acima (reaproveitado do envio de e-mail, item 3c).
          const notifyResults = await Promise.allSettled([
            withTimeout(supabase.functions.invoke('ybytu-notify-plan-ready'), 5000),
            withTimeout(supabase.functions.invoke('ybytu-create-plan-share-token'), 5000),
          ]);
          notifyResults.forEach((result, i) => {
            const label = i === 0 ? 'ybytu-notify-plan-ready' : 'ybytu-create-plan-share-token';
            if (result.status === 'rejected') console.error(`${label} falhou:`, result.reason);
            else if (result.value?.timedOut) console.error(`${label} não respondeu em 5s (timeout) -- seguindo mesmo assim (fail-soft)`);
          });

          // 5. Mostra a tela de confirmação -- SEM redirect automático pro
          // WhatsApp (achado 2026-09-17, ver item 3a: whatsapp-webhook nunca
          // reage a mensagem recebida, não é opt-in nem abre janela de 24h
          // pra nada que a gente manda depois -- é sempre template HSM
          // business-initiated. O botão de WhatsApp na tela de confirmação é
          // opcional). Mostra mesmo se o gerador ou as notificações acima
          // falharam (fail-soft) -- o aluno já está com o profile salvo.
          setFinished({ firstName, email, whatsappPhone, emailSent });
        } catch (e) {
          alert(e.message || "Ocorreu um erro ao salvar o perfil.");
          console.error(e);
        } finally {
          setLoading(false);
        }
      }
    };

    if (loading) {
      return (
        <div className="flex w-full py-20 bg-bgBody justify-center items-center rounded-xl">
          <div className="w-12 h-12 border-4 border-brand border-t-transparent rounded-full animate-spin"></div>
        </div>
      );
    }

    // Tela final -- substitui o formulário inteiro, sem caminho de volta.
    if (finished) {
      return (
        <div className="flex w-full bg-bgBody justify-center items-center font-sans p-2 rounded-xl">
          <div className="flex flex-col w-full max-w-2xl bg-bgBody shadow-lg rounded-xl sm:border sm:border-borderColor overflow-hidden">
            <div className="px-8 pt-10 pb-8">
              <span className="inline-flex w-14 h-14 rounded-full bg-green-100 items-center justify-center text-green-600 mb-5">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6 9 17l-5-5" /></svg>
              </span>
              <h1 className="text-2xl font-black text-textMain mb-2 leading-tight">Perfil confirmado, {finished.firstName}!</h1>
              <p className="text-textMuted mb-7">Recebemos suas respostas. Aqui está o que acontece agora:</p>

              <div className="flex flex-col gap-4 mb-6">
                <div className="flex gap-3 items-start">
                  <span className="flex-shrink-0 w-6 h-6 rounded-full bg-brand text-white flex items-center justify-center text-xs font-bold">1</span>
                  <p className="m-0 text-sm leading-relaxed pt-0.5"><strong>Seu plano já está sendo gerado</strong> com base nas suas respostas.</p>
                </div>
                <div className="flex gap-3 items-start">
                  <span className="flex-shrink-0 w-6 h-6 rounded-full bg-brand text-white flex items-center justify-center text-xs font-bold">2</span>
                  <p className="m-0 text-sm leading-relaxed pt-0.5"><strong>Um personal trainer e uma nutricionista revisam</strong> tudo antes de liberar pra você.</p>
                </div>
                <div className="flex gap-3 items-start">
                  <span className="flex-shrink-0 w-6 h-6 rounded-full bg-brand text-white flex items-center justify-center text-xs font-bold">3</span>
                  <p className="m-0 text-sm leading-relaxed pt-0.5"><strong>O link do plano chega pelo seu WhatsApp</strong> assim que a revisão terminar.</p>
                </div>
              </div>

              <div className="bg-surface border border-borderColor rounded-xl px-4 py-3 mb-6 flex gap-2.5 items-center">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-brand flex-shrink-0"><circle cx="12" cy="12" r="10" /><path d="M12 6v6l4 2" /></svg>
                <p className="m-0 text-sm"><strong>Prazo de revisão:</strong> em até 48 horas</p>
              </div>

              <div className="border-t border-borderColor pt-5 mb-4">
                <p className="m-0 mb-1 text-xs text-textMuted font-bold uppercase tracking-wide">Vamos te avisar pelo WhatsApp</p>
                <p className="m-0 text-sm">
                  {maskPhone(finished.whatsappPhone)}
                  {' · '}
                  <a href={`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(`Olá, sou ${finished.firstName} -- o número de WhatsApp que cadastrei está errado, poderiam me ajudar a corrigir?`)}`} target="_blank" rel="noopener" className="text-brand font-bold no-underline">Número errado? Fale com a gente</a>
                </p>
              </div>

              {finished.emailSent && (
                <p className="text-sm text-textMuted leading-relaxed mb-4">Também enviamos um e-mail de confirmação com esse resumo para <strong className="text-textMain">{finished.email}</strong>.</p>
              )}

              <div className="bg-surface rounded-xl px-4 py-3">
                <p className="m-0 mb-1 text-sm font-bold">Não recebeu o link dentro do prazo?</p>
                <p className="m-0 text-sm text-textMuted leading-relaxed">
                  Confira se o número do WhatsApp está correto acima{finished.emailSent ? ' e olhe sua caixa de spam no e-mail' : ''}. Se ainda assim não chegar, fale com a gente pelo WhatsApp da equipe abaixo.
                </p>
              </div>
            </div>

            <div className="px-8 pb-8">
              <button
                onClick={openTeamWhatsApp}
                className="flex items-center justify-center gap-2 w-full p-3 rounded-xl border border-borderColor text-textMuted font-bold text-sm"
              >
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.29-1.39a9.9 9.9 0 0 0 4.75 1.21h.01c5.46 0 9.9-4.45 9.9-9.91S17.5 2 12.04 2Z" /></svg>
                Falar com a equipe no WhatsApp (opcional)
              </button>
            </div>
          </div>
        </div>
      );
    }

    const currentData = visibleSteps[currentStep];

    return (
      <div className="flex w-full bg-bgBody justify-center items-center font-sans p-2 rounded-xl">
        <div className="flex flex-col w-full max-w-2xl bg-bgBody shadow-lg rounded-xl sm:border sm:border-borderColor overflow-hidden">
          
          <div className="px-6 pt-8 pb-4">
            <div className="h-1.5 w-full bg-surface rounded-full overflow-hidden mb-6 relative">
              <div 
                className="h-full bg-brand transition-all duration-300 ease-in-out" 
                style={{ width: `${((currentStep + 1) / visibleSteps.length) * 100}%` }} 
              />
            </div>
            <span className="text-xs font-bold text-textMuted uppercase tracking-widest">
              Passo {currentStep + 1}/{visibleSteps.length}
            </span>
          </div>

          <div className="px-6 pb-6 flex-grow overflow-y-auto max-h-[60vh]">
            <h2 className="text-3xl font-black text-textMain mb-2 leading-tight">{currentData.title}</h2>
            <p className="text-textMuted mb-8">{currentData.subtitle}</p>

            {currentData.type === 'form' ? (
              <div className="flex flex-col gap-4">
                {currentData.fields.map((field) => (
                  <input 
                    key={field.id}
                    type={field.type}
                    value={answers[field.id] || ''} 
                    onChange={(e) => setAnswers({...answers, [field.id]: e.target.value})} 
                    placeholder={field.placeholder} 
                    className="w-full bg-surface text-textMain p-5 rounded-2xl text-xl border border-borderColor transition-all min-h-[60px]" 
                  />
                ))}
              </div>
            ) : currentData.type === 'number' || currentData.type === 'text' ? (
              <input 
                type={currentData.type === 'number' ? "number" : "text"}
                value={answers[currentData.dbField] || ''} 
                onChange={(e) => setAnswers({...answers, [currentData.dbField]: e.target.value})} 
                placeholder={currentData.placeholder} 
                className="w-full bg-surface text-textMain p-5 rounded-2xl text-xl border border-borderColor transition-all min-h-[60px]" 
              />
            ) : currentData.type === 'slider' ? (
              <div className="bg-surface p-8 rounded-3xl border border-borderColor flex flex-col items-center shadow-sm">
                <div className="text-brand text-6xl font-black mb-4">
                  {answers[currentData.dbField] || currentData.recommended}
                  <span className="text-2xl text-textMuted font-bold"> {currentData.unit}</span>
                </div>
                <input
                  type="range"
                  min={currentData.min}
                  max={currentData.max}
                  step={currentData.step}
                  value={answers[currentData.dbField] || currentData.recommended}
                  onChange={(e) => setAnswers({...answers, [currentData.dbField]: Number(e.target.value)})}
                  className="w-full h-2 bg-gray-300 rounded-lg appearance-none cursor-pointer accent-brand"
                />
              </div>
            ) : (
              <div className="flex flex-col gap-3">
                {(() => {
                  const noneOption = currentData.type === 'multiple' ? findNoneOption(currentData.options) : null;
                  const noneSelected = noneOption && (answers[currentData.dbField] || []).includes(noneOption.id);
                  const blockedByPreferenceIds = currentData.dbField === 'dietary_restrictions_ids'
                    ? getBlockedRestrictionIds(answers.dietary_preference_id)
                    : [];
                  return currentData.options?.map((opt, i) => {
                  const isSelected = currentData.type === 'multiple'
                    ? (answers[currentData.dbField] || []).includes(opt.id)
                    : answers[currentData.dbField] === opt.id;
                  const isDisabled = (noneSelected && opt.id !== noneOption.id) || blockedByPreferenceIds.includes(opt.id);
                  return (
                    <button
                      key={i}
                      onClick={() => !isDisabled && handleSelect(opt.id)}
                      disabled={isDisabled}
                      className={`p-5 rounded-2xl flex justify-between items-center border transition-all duration-300 w-full text-left
                        ${isDisabled ? 'opacity-40 cursor-not-allowed' : 'cursor-pointer'}
                        ${isSelected ? 'border-brand bg-brand/10 shadow-sm' : 'border-borderColor bg-surface hover:bg-gray-50'}`}
                    >
                      <span className={`text-lg font-medium transition-colors ${isSelected ? 'text-brand' : 'text-textMain'}`}>
                        {opt.name_ptbr || opt.name}
                      </span>
                      
                      <div className={`w-6 h-6 flex justify-center items-center flex-shrink-0 transition-all duration-300
                        ${currentData.type === 'multiple' ? 'rounded-md' : 'rounded-full'} 
                        ${isSelected ? 'bg-brand border-brand shadow-[0_0_8px_rgba(245,95,22,0.4)]' : 'border-2 border-gray-300 bg-surface'}`}>
                        
                        <svg 
                          className={`w-3.5 h-3.5 text-white transition-transform duration-300 ease-out ${isSelected ? 'scale-100 opacity-100' : 'scale-50 opacity-0'}`} 
                          fill="none" 
                          viewBox="0 0 24 24" 
                          stroke="currentColor" 
                          strokeWidth="3"
                        >
                          <path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" />
                        </svg>

                      </div>
                    </button>
                  );
                  });
                })()}
              </div>
            )}
          </div>

          <div className="p-6 flex gap-4 border-t border-borderColor bg-bgBody">
            <button 
              onClick={() => setCurrentStep(Math.max(0, currentStep - 1))}
              disabled={currentStep === 0}
              className={`flex-1 p-4 rounded-xl items-center justify-center font-bold transition-opacity ${currentStep === 0 ? 'opacity-50 cursor-not-allowed bg-gray-200 text-gray-500' : 'bg-surface hover:bg-gray-100 text-textMuted'}`}
            >
              VOLTAR
            </button>
            <button 
              onClick={nextStep} 
              disabled={isNextDisabled()}
              className={`flex-[2] p-4 rounded-xl flex items-center justify-center transition-all ${isNextDisabled() ? 'bg-gray-300 cursor-not-allowed text-gray-500' : 'bg-brand hover:bg-brand/90 text-white shadow-md'}`}
            >
              <span className="font-black text-lg">
                {currentStep === visibleSteps.length - 1 ? 'FINALIZAR' : 'PRÓXIMO'}
              </span>
            </button>
          </div>

        </div>
      </div>
    );
  }

  const root = ReactDOM.createRoot(document.getElementById('onboarding-root'));
  root.render(<OnboardingApp />);
</script>
